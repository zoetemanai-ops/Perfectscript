<style>

    --borderL: #EDE8DF;

    width: 100%;
    padding: 13px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13.5px;
    color: var(--text);

    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.03);

  input:focus, textarea:focus {
    border-color: var(--gold);

  /* ── Premium select ───────────────────────────────── */
  select {
    width: 100%;
    padding: 13px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13.5px;
    color: var(--text);
    background: var(--surface2);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    appearance: none;
    -webkit-appearance: none;

  a { color: var(--gold); text-decoration: none; }

  /* ── Scrollbar ────────────────────────────────────── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--goldLight); border-radius: 4px; }

  /* ── Animations ───────────────────────────────────── */
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity:0; } to { opacity:1; }
  }
  @keyframes slideIn {
    from { opacity:0; transform:translateX(28px); }
    to   { opacity:1; transform:translateX(0); }
  }
  @keyframes shimmer {
    0%   { background-position: -300% center; }

  @keyframes spin {

  .page { animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1) forwards; }
  .panel { animation: slideIn 0.3s cubic-bezier(0.16,1,0.3,1) forwards; }
  .row-hover:hover { background: var(--s2) !important; cursor: pointer; transition: all 0.15s; box-shadow: inset 3px 0 0 var(--gold); }
  .delete-btn:hover { background: var(--red) !important; color: #fff !important; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(168, 48, 48, 0.2); }
  .pdf-btn:hover { background: var(--gold) !important; color: #fff !important; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(196, 151, 63, 0.25); }

  /* ── Generate button ─────────────────────────────── */
  .gen-btn {
    position: relative;
    overflow: hidden;
    letter-spacing: 0.04em;
    transition: transform 0.15s, box-shadow 0.2s !important;
  }
  .gen-btn:hover:not(:disabled) {

  }
  .gen-btn:active:not(:disabled) { transform: translateY(0); }
  .gen-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.2) 50%, transparent 65%);
    background-size: 300% auto;

  }
  .gen-btn:hover::after {

  .gen-btn-loading {

  /* ── Client card ─────────────────────────────────── */

    background-size: 200px 200px;
  }
</style>

<script type="text/babel">
const { useState, useEffect } = React;

const T = {
  bg:"#F2EFE8", surface:"#FAF8F4", s2:"#F7F4EE", surface2:"#fff",
  gold:"#C4973F", goldBg:"#F7EDD8", goldDark:"#8B6820", goldLight:"#E8D4A8",
  char:"#0F0D0A", text:"#1C1916", muted:"#8A7F72",
  border:"#E2DBD0", borderL:"#EDE8DF",
  red:"#A83030", green:"#2E6B50", greenBg:"#E8F4EE",
};

const CONFIG = {
  supabaseUrl: "https://hjbhjbqfgfshclpbyvbc.supabase.co",
  supabaseKey: "sb_publishable_0YImfOauT-m18snB9DgWLA_z9KzWCOa",
  webhookUrl:  "https://content-cartel-1.app.n8n.cloud/webhook/generate-script",
  titleWebhookUrl: "https://content-cartel-1.app.n8n.cloud/webhook/regen-title",
  titlePickWebhookUrl: "https://content-cartel-1.app.n8n.cloud/webhook/title-pick",
  appUrl:      "https://perfectscript-gamma.vercel.app/",
};

// ── AUTH CLIENT ───────────────────────────────────────────────
// One Supabase client, used ONLY for auth (login, session, token refresh,
// password reset). All data reads/writes still go through the sb() helper
// below, but that helper now rides the logged-in user's JWT instead of the
// public key — so once RLS is on, nothing works without a valid session.
const supaAuth = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, {
  auth: {
    persistSession: true,       // keep the session across reloads
    autoRefreshToken: true,     // refresh the JWT before it expires
    detectSessionInUrl: true,   // pick up the recovery token from the reset link
    flowType: "implicit",
  },
});


const RUNTIME_OPTIONS = [
  { value: "0:0",   label: "Default (from profile)" },
  { value: "5:10",  label: "5–10 min" },
  { value: "10:15", label: "10–15 min" },
  { value: "15:20", label: "15–20 min" },
  { value: "20:25", label: "20–25 min" },
  { value: "25:30", label: "25–30 min" },
  { value: "30:35", label: "30–35 min" },
];

// Topic queue items can be strings (legacy) or objects ({angle, data_point, signal_sources, signal_strength}).
// This helper safely extracts the display text either way.
function topicText(qt) {
  if (qt == null) return "";
  if (typeof qt === "string") return qt;
  if (typeof qt === "object") {
    const t = qt.angle || qt.topic || qt.text || qt.data_point;
    return (typeof t === "string" && t.trim()) ? t : "Suggested topic (no title)";
  }
  return String(qt);
}

function sb(url, key) {
  const base = `${url}/rest/v1`;
  // Build headers per request so the JWT is always fresh (autoRefreshToken keeps
  // it valid). apikey stays the publishable key (required by PostgREST); the
  // Authorization Bearer carries the logged-in user's access token. No session =
  // falls back to the publishable key, which RLS will reject → 0 rows. That's the gate.
  async function hdrs() {
    let token = key;
    try {
      const { data } = await supaAuth.auth.getSession();
      if (data && data.session && data.session.access_token) token = data.session.access_token;
    } catch {}
    return { apikey:key, Authorization:`Bearer ${token}`, "Content-Type":"application/json", Prefer:"return=representation" };
  }
  async function check(r) {
    if (!r.ok) {
      let msg = `HTTP ${r.status}`;
      try { const e = await r.json(); msg = e.message || e.error || JSON.stringify(e); } catch {}
      throw new Error(msg);
    }
    return r.json();
  }
  return {
    get:   async (t, q="")  => fetch(`${base}/${t}${q}`, { headers: await hdrs() }).then(r => r.json()),
    post:  async (t, d)     => fetch(`${base}/${t}`, { method:"POST", headers: await hdrs(), body:JSON.stringify(d) }).then(check),
    patch: async (t, id, d) => fetch(`${base}/${t}?id=eq.${id}`, { method:"PATCH", headers: await hdrs(), body:JSON.stringify(d) }).then(check),
    del:   async (t, id)    => fetch(`${base}/${t}?id=eq.${id}`, { method:"DELETE", headers: await hdrs() }),
  };
}

// ── SHARED ────────────────────────────────────────────────────
function Btn({ children, variant="primary", onClick, disabled, full, style={} }) {
  const base = { display:"inline-flex", alignItems:"center", justifyContent:"center", gap:8, padding:"12px 26px", borderRadius:8, fontSize:15, fontWeight:500, cursor:disabled?"not-allowed":"pointer", border:"none", transition:"all 0.15s", width:full?"100%":undefined, letterSpacing:"0.01em", ...style };
  const v = {
    primary: { background:T.char, color:"#fff", opacity:disabled?0.4:1 },
    gold:    { background:T.gold, color:"#fff", opacity:disabled?0.4:1 },
    ghost:   { background:"transparent", color:T.text, border:`1px solid ${T.border}` },
    danger:  { background:T.red, color:"#fff" },
    link:    { background:"none", color:T.gold, padding:0, fontWeight:500, fontSize:13 },
  };
  return <button onClick={disabled?undefined:onClick} style={{...base,...v[variant]}}>{children}</button>;
}

const IS = { width:"100%", padding:"11px 15px", border:`1px solid ${T.border}`, borderRadius:8, fontSize:14, color:T.text, background:T.surface, outline:"none", boxSizing:"border-box" };

function InfoTooltip({ text }) {
  const [show, setShow] = useState(false);
  return (
    <span style={{ position:"relative", display:"inline-flex", marginLeft:6, verticalAlign:"middle" }}>
      <span
        onMouseEnter={() => setShow(true)}
        onMouseLeave={() => setShow(false)}
        onClick={(e) => { e.preventDefault(); setShow(s => !s); }}
        style={{ width:15, height:15, borderRadius:"50%", background:T.border, color:"#fff", fontSize:10, fontWeight:600, display:"inline-flex", alignItems:"center", justifyContent:"center", cursor:"help", userSelect:"none" }}
      >i</span>
      {show && (
        <span style={{ position:"absolute", bottom:"calc(100% + 8px)", left:"50%", transform:"translateX(-50%)", background:T.char, color:"#fff", fontSize:11, lineHeight:1.5, padding:"10px 12px", borderRadius:8, width:260, textTransform:"none", letterSpacing:0, fontWeight:400, boxShadow:"0 8px 20px rgba(0,0,0,0.15)", zIndex:100, pointerEvents:"none" }}>
          {text}
        </span>
      )}
    </span>
  );
}

function Field({ label, hint, sub, children, mb=20 }) {
  return (
    <div style={{ marginBottom:mb }}>
      {label && <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:7 }}>
        <div>
          <label style={{ fontSize:12, fontWeight:600, color:T.text, letterSpacing:"0.07em", textTransform:"uppercase" }}>{label}</label>
          {sub && <span style={{ fontSize:13, color:T.muted, marginLeft:8, fontWeight:400, textTransform:"none", letterSpacing:0 }}>{sub}</span>}
        </div>
        {hint && <span style={{ fontSize:13, color:T.muted }}>{hint}</span>}
      </div>}
      {children}
    </div>
  );
}

function Input({ label, hint, sub, value, onChange, type="text", placeholder, readOnly, mb }) {
  return <Field label={label} hint={hint} sub={sub} mb={mb}>
    <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} readOnly={readOnly}
      style={{...IS, background:readOnly?T.bg:T.surface, color:readOnly?T.muted:T.text}} />
  </Field>;
}

function TextArea({ label, hint, sub, value, onChange, placeholder, rows=4, mb }) {
  return <Field label={label} hint={hint} sub={sub} mb={mb}>
    <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={rows} style={{...IS, lineHeight:1.7, resize:"vertical"}} />
  </Field>;
}

function SectionDivider({ label }) {
  return <div style={{ display:"flex", alignItems:"center", gap:14, margin:"32px 0 22px" }}>
    <div style={{ flex:1, height:"1px", background:T.border }} />
    <span style={{ fontSize:10, fontWeight:500, color:T.muted, letterSpacing:"0.1em", textTransform:"uppercase" }}>{label}</span>
    <div style={{ flex:1, height:"1px", background:T.border }} />
  </div>;
}

function Badge({ children, color="neutral" }) {
  const c = {
    neutral: { bg:T.bg,     text:"#6B6059" },
    green:   { bg:T.greenBg, text:T.green },
    gold:    { bg:T.goldBg,  text:T.goldDark }
  }[color] || { bg:T.bg, text:"#6B6059" };
  return <span style={{ fontSize:12, fontWeight:500, padding:"5px 14px", borderRadius:20, background:c.bg, color:c.text, whiteSpace:"nowrap" }}>{children}</span>;
}

function Toast({ msg }) {
  if (!msg) return null;
  const colors = { success:{bg:T.greenBg,border:"#B8DEC9",text:T.green}, error:{bg:"#FDF0F0",border:"#E8C0C0",text:T.red}, info:{bg:T.goldBg,border:"#D4B88A",text:T.goldDark} };
  const c = colors[msg.type] || colors.info;
  return <div style={{ position:"fixed", bottom:32, right:32, background:c.bg, color:c.text, border:`1px solid ${c.border}`, borderRadius:12, padding:"14px 22px", fontSize:13, fontWeight:500, zIndex:999, boxShadow:"0 8px 32px rgba(28,25,23,0.1)" }}>{msg.message}</div>;
}

// ── TOPIC QUEUE MANAGER ───────────────────────────────────────
function TopicQueue({ topics, onChange }) {
  const [newTopic, setNewTopic] = useState("");

  function add() {
    if (!newTopic.trim()) return;
    onChange([...topics, newTopic.trim()]);
    setNewTopic("");
  }

  function remove(i) {
    onChange(topics.filter((_, idx) => idx !== i));
  }

  function move(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= topics.length) return;
    const next = [...topics];
    [next[i], next[j]] = [next[j], next[i]];
    onChange(next);
  }

  const arrowBtn = (enabled) => ({ display:"flex", alignItems:"center", justifyContent:"center", width:28, height:24, padding:0, background: enabled ? T.surface : "transparent", border:`1px solid ${enabled ? T.borderL : "transparent"}`, borderRadius:7, cursor: enabled ? "pointer" : "default", color: enabled ? T.char : "rgba(120,113,108,0.30)", fontSize:10, lineHeight:1 });

  return (
    <div>
      {topics.length === 0
        ? <div style={{ padding:"22px 18px", background:T.bg, borderRadius:10, fontSize:15, color:T.muted, textAlign:"center", marginBottom:14, lineHeight:1.6 }}>No topics yet.</div>
        : <div style={{ marginBottom:14, border:`1px solid ${T.border}`, borderRadius:12, overflow:"hidden" }}>
            {topics.map((t, i) => {
              const isNext = i === 0;
              return (
                <div key={i} style={{ display:"flex", alignItems:"center", gap:12, padding:"13px 14px", borderBottom:i<topics.length-1?`1px solid ${T.borderL}`:"none", background:isNext?T.goldBg:T.surface }}>
                  <div style={{ minWidth:78, flexShrink:0, display:"flex", justifyContent:"center" }}>
                    {isNext
                      ? <span style={{ fontSize:10, fontWeight:700, color:"#fff", background:T.gold, padding:"4px 9px", borderRadius:20, letterSpacing:"0.06em", whiteSpace:"nowrap" }}>▶ NEXT UP</span>
                      : <span style={{ fontSize:12, fontWeight:500, color:T.muted }}>{i+1}</span>}
                  </div>
                  <div style={{ flex:1, fontSize:15, color:T.text, lineHeight:1.6 }}>{topicText(t)}</div>
                  <div style={{ display:"flex", flexDirection:"column", gap:5, flexShrink:0 }}>
                    <button title="Move up"   onClick={() => move(i, -1)} disabled={i === 0}              style={arrowBtn(i !== 0)}>▲</button>
                    <button title="Move down" onClick={() => move(i,  1)} disabled={i === topics.length-1} style={arrowBtn(i !== topics.length-1)}>▼</button>
                  </div>
                  <button title="Remove this topic" onClick={() => remove(i)} className="delete-btn" style={{ flexShrink:0, padding:"7px 14px", border:`1px solid ${T.border}`, borderRadius:8, background:T.surface, color:T.muted, fontSize:12.5, fontWeight:500, cursor:"pointer", fontFamily:"'DM Sans',sans-serif", whiteSpace:"nowrap", transition:"all 0.15s" }}>Delete</button>
                </div>
              );
            })}
          </div>
      }
      <div style={{ display:"flex", gap:8 }}>
        <input
          type="text"
          value={newTopic}
          onChange={e => setNewTopic(e.target.value)}
          onKeyDown={e => e.key === "Enter" && add()}
          placeholder="Type a new topic idea and press Enter…"
          style={{...IS, flex:1}}
        />
        <button onClick={add} disabled={!newTopic.trim()} style={{ padding:"11px 20px", background: newTopic.trim() ? T.char : T.border, color:"#fff", border:"none", borderRadius:8, fontSize:13, fontWeight:500, cursor: newTopic.trim() ? "pointer" : "default", whiteSpace:"nowrap" }}>Add</button>
      </div>
    </div>
  );
}

// ── SIDEBAR ───────────────────────────────────────────────────
const NAV = [
  { id:"generate", label:"Generate",  sub:"Script Generator" },
  { id:"topics",   label:"Topics",    sub:"Up next"          },
  { id:"clients",  label:"Clients",   sub:"Profile Manager"  },
  { id:"history",  label:"History",   sub:"Script Runs"      },
];

function Sidebar({ view, setView, clientCount, userEmail, onLogout }) {
  return (
    <nav style={{ width:236, minHeight:"100vh", background:T.char, display:"flex", flexDirection:"column", position:"fixed", top:0, left:0, zIndex:10 }}>
      <div style={{ height:3, background:`linear-gradient(90deg, ${T.gold}, #D4A96A, ${T.gold})` }} />
      <div style={{ padding:"32px 28px 28px" }}>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:13, fontWeight:400, color:"rgba(255,255,255,0.3)", letterSpacing:"0.16em", textTransform:"uppercase", marginBottom:10 }}>Content Cartel</div>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:26, fontWeight:300, color:"#fff", lineHeight:1.25 }}>The Perfect<br/><span style={{ fontStyle:"italic", color:T.gold }}>Script</span></div>
      </div>
      <div style={{ height:"1px", background:"rgba(255,255,255,0.06)", margin:"0 20px" }} />
      <div style={{ padding:"20px 14px", flex:1 }}>
        {NAV.map(n => {
          const active = view === n.id;

function SearchableSelect({ value, onChange, options, placeholder = "— Choose —", emptyText = "No matches" }) {
  const [open, setOpen] = React.useState(false);
  const [search, setSearch] = React.useState("");
  const wrapperRef = React.useRef(null);
  const inputRef = React.useRef(null);

  // Close on outside click
  React.useEffect(() => {
    function onDoc(e) {
      if (wrapperRef.current && !wrapperRef.current.contains(e.target)) {
        setOpen(false); setSearch("");
      }
    }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);

  // Auto-focus search when opened
  React.useEffect(() => {
    if (open && inputRef.current) inputRef.current.focus();
  }, [open]);

  const filtered = options.filter(o => o.label.toLowerCase().includes(search.toLowerCase()));
  const selected = options.find(o => o.value === value);

  return (
    <div ref={wrapperRef} style={{ position:"relative", border:`2px solid ${value?T.gold:T.border}`, borderRadius:12, background:value?T.goldBg:T.surface2, boxShadow:value?"0 2px 12px rgba(196,151,63,0.1)":"none", transition:"all 0.15s" }}>
      <div onClick={() => setOpen(!open)} style={{ width:"100%", padding:"14px 18px", paddingRight:42, fontSize:17, color:value?T.goldDark:T.muted, background:"transparent", cursor:"pointer", fontFamily:"'DM Sans',sans-serif", fontWeight:500, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <span style={{ overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{selected ? selected.label : placeholder}</span>
        <span style={{ fontSize:14, color:T.gold, transform:open?"rotate(180deg)":"rotate(0deg)", transition:"transform 0.15s", flexShrink:0, marginLeft:12 }}>▾</span>
      </div>
      {open && (
        <div style={{ position:"absolute", top:"calc(100% + 4px)", left:0, right:0, background:T.surface, border:`1px solid ${T.border}`, borderRadius:12, boxShadow:"0 8px 32px rgba(28,25,23,0.14)", zIndex:50, overflow:"hidden", maxHeight:360, display:"flex", flexDirection:"column" }}>
          <div style={{ padding:"10px 12px", borderBottom:`1px solid ${T.borderL}`, background:T.surface2, flexShrink:0 }}>
            <input
              ref={inputRef}
              type="text"
              value={search}
              onChange={e => setSearch(e.target.value)}
              placeholder="Search..."
              style={{ width:"100%", padding:"8px 12px", border:`1px solid ${T.border}`, borderRadius:8, fontSize:14, color:T.text, background:T.surface, outline:"none", boxSizing:"border-box", fontFamily:"'DM Sans',sans-serif" }}
            />
          </div>
          <div style={{ overflowY:"auto", flex:1 }}>
            {filtered.length === 0
              ? <div style={{ padding:"16px 18px", fontSize:14, color:T.muted, textAlign:"center" }}>{emptyText}</div>
              : filtered.map(o => {
                  const isSelected = o.value === value;
                  return <div key={o.value} onClick={() => { onChange(o.value); setOpen(false); setSearch(""); }} style={{ padding:"11px 18px", fontSize:15, color:isSelected?T.goldDark:T.text, background:isSelected?T.goldBg:"transparent", cursor:"pointer", fontWeight:isSelected?500:400, transition:"background 0.1s" }} onMouseEnter={e => { if (!isSelected) e.currentTarget.style.background = T.bg; }} onMouseLeave={e => { if (!isSelected) e.currentTarget.style.background = "transparent"; }}>
                    {o.label}
                  </div>;
                })
            }
          </div>
        </div>
      )}
    </div>
  );
}

function ClientPanel({ client, onClose, onSave, onDelete }) {
  const isNew = !client.id;
  const [f, setF] = useState({
    id:                 client.id || null,
    client_slug:        client.client_slug ?? "",
    client_name:        client.client_name ?? "",
    niche:              client.niche ?? "",
    tone_of_voice:      client.tone_of_voice ?? "",
    limiting_beliefs:   client.limiting_beliefs ?? "",
    credibility_statement: client.credibility_statement ?? "",
    script_format:       client.script_format || "word_for_word",
    signature_closing:  client.signature_closing ?? "",
    next_video_cta:     client.next_video_cta ?? "",
    client_dna:         client.client_dna ?? "",
    sponsor_name:       client.sponsor_name ?? "",
    sponsor_brief:      client.sponsor_brief ?? "",
    cta_primary:        client.cta_primary ?? "",
    script_length_min:  client.script_length_min || 10,
    script_length_max:  client.script_length_max || 15,
    active:             client.active !== undefined ? client.active : true,
    whiteboard_enabled: client.whiteboard_enabled !== false,
    creative_owner:     client.creative_owner ?? "",
  });
  const set = k => v => setF(p => ({ ...p, [k]:v }));
  const scrollRef = React.useRef(null);

  // Unsaved-changes guard: snapshot the form when the panel opens, warn on any exit while changed.
  const baseline = React.useRef(null);
  if (baseline.current === null) baseline.current = JSON.stringify(f);
  const dirty = JSON.stringify(f) !== baseline.current;
  function attemptClose() {
    if (dirty && !window.confirm("You have unsaved changes. Close without saving?")) return;
    onClose();
  }
  React.useEffect(() => {
    function h(e) { if (dirty) { e.preventDefault(); e.returnValue = ""; } }
    window.addEventListener("beforeunload", h);
    return () => window.removeEventListener("beforeunload", h);
  }, [dirty]);

  React.useEffect(() => {
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = ""; };
  }, []);

  React.useLayoutEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
  }, []);

  function handleSave() {
    onSave({ ...f, active: true });
  }

  const Divider = ({ label, sub }) => (
    <div style={{ margin:"40px 0 20px" }}>

              <div style={{ fontSize:13, color:T.muted, marginTop:1 }}>Show drawn examples on screen during the video</div>
            </div>
          </div>

          <Divider label="Content" />
          <ExpandableInput label="Primary CTA" sub="the offer to promote – read verbatim mid-video and after the hook" value={f.cta_primary} onChange={set("cta_primary")} />
          <ExpandableInput label="Signature Closing" sub="this creator's signature line, word for word at end of every outro" value={f.signature_closing} onChange={set("signature_closing")} />
          <ExpandableInput label="Next Video CTA" sub="suggestion to watch another video – YouTube retention line at the very end" value={f.next_video_cta} onChange={set("next_video_cta")} />

          <ExpandableInput label="Sponsor Name" value={f.sponsor_name} onChange={set("sponsor_name")} />
          <ExpandableInput label="Sponsor Description" value={f.sponsor_brief} onChange={set("sponsor_brief")} />

          {onDelete && (
            <div style={{ marginTop:56, paddingTop:32, borderTop:`1px solid ${T.borderL}`, display:"flex", justifyContent:"center" }}>
              <button onClick={onDelete} className="delete-btn" style={{ padding:"10px 22px", background:"transparent", border:`1px solid ${T.red}`, borderRadius:8, color:T.red, fontSize:13, fontWeight:500, cursor:"pointer", letterSpacing:"0.02em", fontFamily:"'DM Sans',sans-serif", transition:"all 0.15s" }}>Delete this client</button>
            </div>
          )}

        </div>

        {/* ── Sticky footer with Save / Cancel ── */}
        <div style={{ padding:"16px 44px", borderTop:`1px solid ${T.border}`, background:T.surface2, display:"flex", gap:12, flexShrink:0, boxShadow:"0 -4px 12px rgba(0,0,0,0.04)" }}>
          <Btn variant="ghost" onClick={attemptClose} style={{ flex:1, padding:"13px" }}>Cancel</Btn>
          <Btn variant="gold" onClick={handleSave} style={{ flex:2, padding:"13px", fontSize:14 }}>Save Changes</Btn>
        </div>

      </div>
    </div>
  , document.body);
}

// ── GENERATE VIEW ─────────────────────────────────────────────
// ── PDF GENERATOR ────────────────────────────────────────────
function downloadPDF(scriptText, filename, videoTitle, topic) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pw = doc.internal.pageSize.width;
  const ph = doc.internal.pageSize.height;
  const ml = 22, mr = 22, mt = 24, mb = 22;
  const cw = pw - ml - mr;

  // ── PALETTE ────────────────────────────────────────────────
  const C = {
    char:     [15,  13,  10],
    gold:     [196, 151, 63],
    goldDark: [139, 104, 32],
    goldBg:   [247, 237, 216],
    goldLight:[232, 212, 168],
    muted:    [138, 127, 114],
    white:    [255, 255, 255],
    offwhite: [250, 248, 244],
    light:    [226, 219, 208],
    insight:  [247, 244, 238],
    ctaBg:    [242, 235, 220],
    midCta:   [232, 222, 200],
    sidebar:  [10,  8,   6],
    cream:    [245, 241, 232],
    creamLight: [250, 247, 240],
  };

  let y = mt;
  let pageNum = 0;

  function rgb(arr, type='fill') {
    if (type==='fill') doc.setFillColor(...arr);
    else doc.setTextColor(...arr);
  }

  function newPage() {
    doc.addPage();
    pageNum++;
    y = mt;
    // Subtle top border line
    doc.setDrawColor(...C.gold);
    doc.setLineWidth(0.4);
    doc.line(ml, 12, pw-mr, 12);
    y = mt;
  }

  function check(needed=10) {
    if (y + needed > ph - mb - 10) { newPage(); return true; }
    return false;
  }

  function hline(yp, color=C.light, w=0.3) {
    doc.setDrawColor(...color);
    doc.setLineWidth(w);
    doc.line(ml, yp, pw-mr, yp);
  }

  // ── COVER PAGE ─────────────────────────────────────────────
  pageNum = 1;
  // Full cream background
  rgb(C.cream,'fill');
  doc.rect(0, 0, pw, ph, 'F');

  // Top label
  doc.setFont('helvetica','bold');
  doc.setFontSize(8);
  doc.setCharSpace(3);
  rgb(C.goldDark,'text');
  doc.text('CONTENT CARTEL', ml, 22);
  doc.setCharSpace(0);

  // Gold accent line
  doc.setDrawColor(...C.gold);
  doc.setLineWidth(0.4);
  doc.line(ml, 28, ml+60, 28);

  // Parse title and meta from scriptText
  const lines = scriptText.split('\n');
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  const titleText = videoTitle || lines[i]?.trim() || filename || 'Script';
  i++;
  while (i < lines.length && !lines[i].trim()) i++;
  const metaText = lines[i]?.trim() || '';
  if (metaText.startsWith('Script for')) i++;

  // Title — large charcoal
  doc.setFont('helvetica','bold');
  doc.setFontSize(26);
  rgb(C.char,'text');
  const titleLines = doc.splitTextToSize(titleText, cw);
  let ty = 40;
  for (const tl of titleLines) {
    doc.text(tl, ml, ty);
    ty += 10;
  }

  // Meta subtitle — muted gold
  if (metaText) {
    doc.setFont('helvetica','normal');
    doc.setFontSize(10);
    rgb(C.goldDark,'text');
    doc.text(metaText, ml, ty + 1);
    ty += 7;
  }

  // ── MAIN IDEA — vertically centered on cover ──
  // Passed as the `topic` parameter (main_idea, with topic fallback)
  if (topic && String(topic).trim()) {
    const blockTopY = ty + 14;

    // Label "MAIN IDEA" — small, gold, letter-spaced
    doc.setFont('helvetica','bold');
    doc.setFontSize(11);
    doc.setCharSpace(3);
    rgb(C.goldDark,'text');
    doc.text('MAIN IDEA', ml, blockTopY);
    doc.setCharSpace(0);

    // Gold divider under the label
    doc.setDrawColor(...C.gold);
    doc.setLineWidth(0.8);
    doc.line(ml, blockTopY + 4, ml + 38, blockTopY + 4);

    // Topic text — large, charcoal
    doc.setFont('helvetica','normal');
    doc.setFontSize(20);
    rgb(C.char,'text');
    const topicLines = doc.splitTextToSize(String(topic).trim(), cw - 10);
    let tyM = blockTopY + 18;
    for (const tl of topicLines) {
      doc.text(tl, ml, tyM);
      tyM += 10;
    }
  }

  // Bottom of cover: page label
  doc.setFont('helvetica','normal');
  doc.setFontSize(7.5);
  doc.setCharSpace(1.5);
  rgb(C.muted,'text');
  doc.text('CONFIDENTIAL', ml, ph - 14);
  doc.setCharSpace(0);

  // ── HELPER: SECTION HEADER ─────────────────────────────────
  function sectionHeader(label) {
    // Always start a new page for major sections — strip === wrappers first
    const stripped = label.trim().replace(/^=+\s*/, '').replace(/\s*=+$/, '').trim();
    const isMajor = /^(OPENING HOOK|HOOK|SECTION \d|Q\d+:|FINAL CLOSE|MID CTA|OUTRO)/.test(stripped);
    if (isMajor && y > mt + 20) { newPage(); y = 18; }
    else if (isMajor) { y = 18; }
    else { check(28); y += 6; }

    const cleanLabel = label.replace(/===/g,'').trim();

    // Dark bar
    doc.setFont('helvetica','bold');
    doc.setFontSize(13);
    const llines = doc.splitTextToSize(cleanLabel, cw - 10);
    const bh = llines.length * 8 + 10;
    // Light cream background for header
    rgb(C.creamLight,'fill');
    doc.rect(ml, y, cw, bh, 'F');

    // Gold left accent strip
    rgb(C.goldDark,'fill');
    doc.rect(ml, y, 4, bh, 'F');

    // Charcoal text
    rgb(C.char,'text');
    doc.text(llines, ml + 11, y + 8);
    y += bh + 10;
    rgb(C.char,'text');
  }

  // ── HELPER: SUB LABEL (Talking points:, Action steps: etc) ─
  function subLabel(label) {
    check(10);
    doc.setFont('helvetica','bold');
    doc.setFontSize(9.5);
    rgb(C.goldDark,'text');
    doc.text(label, ml, y);
    y += 6;
    rgb(C.char,'text');
  }


  // ── HELPER: render text with **markdown bold** inline, with word wrap ─────
  function drawLineWithBold(line, x, maxWidth) {
    // Parse into segments
    const re = /\*\*([^*]+)\*\*/g;
    let last = 0, m;
    const segs = [];
    while ((m = re.exec(line)) !== null) {
      if (m.index > last) segs.push({ text: line.slice(last, m.index), bold: false });
      segs.push({ text: m[1], bold: true });
      last = m.index + m[0].length;
    }
    if (last < line.length) segs.push({ text: line.slice(last), bold: false });
    if (segs.length === 0) segs.push({ text: line, bold: false });

    // Word-by-word layout with wrapping
    let cx = x;
    const lineHeight = 5.5;
    for (const seg of segs) {
      doc.setFont('helvetica', seg.bold ? 'bold' : 'normal');
      const words = seg.text.split(/(\s+)/);
      for (const w of words) {
        if (!w) continue;
        const ww = doc.getTextWidth(w);
        if (cx + ww > x + maxWidth && w.trim()) {
          // wrap: new line
          y += lineHeight;
          check(lineHeight);
          cx = x;
          if (/^\s+$/.test(w)) continue;
        }
        doc.text(w, cx, y);
        cx += ww;
      }
    }
    doc.setFont('helvetica','normal');
  }

  // ── HELPER: strip markdown bold markers (for splitTextToSize wrap calc) ─
  function stripMarkdownBold(t) {
    return t.replace(/\*\*([^*]+)\*\*/g, '$1');
  }

  // ── HELPER: BULLET ──────────────────────────────────────────
  function bullet(text) {
    const clean = text.replace(/^[●•\-]\s*/,'');
    const colonIdx = clean.indexOf(' : ');
    const hasColon = colonIdx !== -1;
    const rawTrigger = hasColon ? clean.slice(0, colonIdx) : null;
    const sanitized = rawTrigger ? rawTrigger.replace(/[`\u2018\u2019\u201C\u201D\u02BC\u0060]/g, "'").replace(/[\u2013\u2014]/g, '-') : null;
    const trigger = sanitized ? sanitized + ':' : null;
    const rest    = hasColon ? clean.slice(colonIdx + 3) : clean;

    check(6);
    // Draw dot
    rgb(C.gold,'fill');
    doc.circle(ml + 2.5, y - 1.3, 0.9, 'F');

    if (hasColon) {
      // Measure bold trigger width
      doc.setFont('helvetica','bold');
      doc.setFontSize(10);
      const triggerW = doc.getTextWidth(trigger + ' ');
      rgb(C.char,'text');
      doc.text(trigger, ml + 7, y);

      // Rest of first line fits after trigger
      doc.setFont('helvetica','normal');
      const restMaxW = cw - 9 - triggerW;
      const restWrapped = doc.splitTextToSize(rest, restMaxW);
      doc.text(restWrapped[0], ml + 7 + triggerW, y);
      y += 5.5;

      // Continuation lines indented, no dot
      for (let wi = 1; wi < restWrapped.length; wi++) {
        check(6);
        doc.text(restWrapped[wi], ml + 7, y);
        y += 5.5;
      }
    } else {
      // No colon — render normally (with markdown bold support)
      // Defensive: normalize "Core goal:" lines to bold prefix even if Claude omits the asterisks
      let normalizedClean = clean;
      const coreMatch = normalizedClean.match(/^(\*\*)?Core goal:(\*\*)?\s*(.+)/i);
      if (coreMatch) {
        normalizedClean = "**Core goal:** " + coreMatch[3].replace(/^\*\*|\*\*$/g, "").trim();
      }
      doc.setFont('helvetica','normal');
      doc.setFontSize(10);
      rgb(C.char,'text');
      const cleanForWrap = stripMarkdownBold(normalizedClean);
      const wrapped = doc.splitTextToSize(cleanForWrap, cw - 9);
      const hasBold = /\*\*[^*]+\*\*/.test(normalizedClean);
      if (!hasBold) {
        doc.text(wrapped[0], ml + 7, y);
        y += 5.5;
        for (let wi = 1; wi < wrapped.length; wi++) {
          check(6);
          doc.text(wrapped[wi], ml + 7, y);
          y += 5.5;
        }
      } else {
        // Single-line bold render (directives are short — fits on one line typically)
        drawLineWithBold(normalizedClean, ml + 7, cw - 9);
        y += 5.5;
      }
    }
    y += 1.5;
  }

  // ── HELPER: CREATOR INSIGHT — rendered as prose paragraph ─
  // ── HELPER: CREATOR INSIGHT — rendered as plain paragraph in flow ─
  function creatorInsight(text) {
    // Strip bullet/dash prefixes too so insight flows as prose
    const clean = text.replace(/^[^:']+'?s insight:\s*/i,'')
      .split('\n')
      .map(l => l.trim().replace(/^[●•\-\u2013\u2014\u25cf]\s*/, ''))
      .filter(Boolean)
      .join(' ')
      .trim();
    bodyText(clean);
  }

  // ── HELPER: MID CTA — bold prefix + match script format style ──
  function midCtaBox(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const hasBullets = lines.some(l => /^[●•\-\u25cf]/.test(l));

    // Bold prefix label
    check(10);
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    rgb(C.goldDark,'text');
    doc.text('MID CALL TO ACTION:', ml, y);
    y += 6;
    doc.setFont('helvetica','normal');

    if (hasBullets) {
      for (const line of lines) {
        if (/^[●•\-\u25cf]/.test(line)) bullet(line);
        else if (line) bullet('● ' + line);
      }
    } else {
      bodyText(lines.join(' '));
    }
  }

  // ── HELPER: SPONSOR — rendered as section + prose ──────────
  function sponsorBox(text) {
    const clean = text.split('\n').map(l => l.replace(/^[-–—]\s*/,'')).join(' ').replace(/\*\*/g,'').trim();
    sectionHeader('SPONSOR');
    bodyText(clean);
  }

  // ── HELPER: WHITEBOARD ──────────────────────────────────────
  function whiteboard(text) {
    // Explicit charSpace reset (defensive — earlier calls may have left charSpace > 0)
    doc.setCharSpace(0);
    // Strip prefix and replace unsupported unicode arrows with ASCII (jsPDF helvetica can't render them)
    let clean = text.replace(/^Whiteboard example:\s*/i,'').trim();
    clean = clean.replace(/[\u2192\u27a1\u27a4\u279c\u2794\u2799]/g, ' -> ').replace(/\s+->\s+/g, ' -> ');
    const wrapped = doc.splitTextToSize(clean, cw - 10);
    const bh = wrapped.length * 5.5 + 10;
    check(bh + 4);
    y += 2;
    doc.setDrawColor(...C.gold);
    doc.setLineWidth(0.4);
    doc.roundedRect(ml, y, cw, bh, 2, 2, 'D');
    doc.setFont('helvetica','bolditalic');
    doc.setFontSize(8.5);
    rgb(C.goldDark,'text');
    doc.setCharSpace(0);
    doc.text('Whiteboard / Digiboard', ml + 4, y + 5.5);
    doc.setFont('helvetica','italic');
    doc.setFontSize(9.5);
    rgb(C.char,'text');
    doc.setCharSpace(0);
    doc.text(wrapped, ml + 4, y + 11);
    y += bh + 5;
  }

  // ── HELPER: SUB BULLET (legacy direction-line renderer, kept as no-op safety net) ──
  function subBullet(text) {
    // Renders an indented direction-line (no marker character) under a main bullet
    const clean = text.replace(/^[\u2013\-]\s*/, '').trim();
    check(5);
    doc.setCharSpace(0);
    doc.setFont('helvetica','italic');
    doc.setFontSize(9.5);
    rgb(C.muted,'text');
    const wrapped = doc.splitTextToSize(clean, cw - 14);
    doc.text(wrapped[0], ml + 8, y);
    y += 5;
    for (let i = 1; i < wrapped.length; i++) {
      check(5);
      doc.text(wrapped[i], ml + 8, y);
      y += 5;
    }
    rgb(C.char,'text');
    y += 1.5;
  }

  // ── HELPER: CONTEXT BOX (gold-bordered, mirrors whiteboard) ─
  function contextBox(bullets) {
    if (!bullets || !bullets.length) return;
    doc.setCharSpace(0);
    const FS = 9.5, LH = 5, innerW = cw - 14;
    doc.setFontSize(FS);

    // Each bullet is "anchor: explanation". The anchor (incl. the colon) is BOLD, the
    // explanation normal. Lay out word-by-word with a hanging indent so a LONG bold anchor
    // WRAPS INSIDE the box instead of running off the right edge. Line 1 carries the marker;
    // continuation lines align under the first word after the marker. Both wrap at the box edge.
    doc.setFont('helvetica','bold');
    const markerW = doc.getTextWidth('o  ');
    doc.setFont('helvetica','normal');
    const spaceW  = doc.getTextWidth(' ');
    const xStart  = ml + 4;            // marker / line-1 left
    const xHang   = ml + 4 + markerW;  // continuation (hanging) indent
    const xRight  = ml + 4 + innerW;   // right edge of the text area
    const measure = (w, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); return doc.getTextWidth(w); };

    // Build laid-out lines for every bullet: [{ tokens: [{ text, bold, x }] }]
    const allLines = [];
    bullets.forEach(b => {
      const ci = b.indexOf(': ');
      let words;
      if (ci === -1) {
        words = b.split(' ').filter(Boolean).map(w => ({ text: w, bold: true }));
      } else {
        const factWords = b.slice(0, ci + 1).split(' ').filter(Boolean).map(w => ({ text: w, bold: true }));
        const restWords = b.slice(ci + 1).replace(/^\s+/, '').split(' ').filter(Boolean).map(w => ({ text: w, bold: false }));
        words = factWords.concat(restWords);
      }
      let line = { tokens: [{ text: 'o  ', bold: true, x: xStart }] };
      let cursor = xStart + markerW;
      let wordsOnLine = 0;
      words.forEach(tok => {
        const w = measure(tok.text, tok.bold);
        if (cursor + w > xRight && wordsOnLine > 0) {
          allLines.push(line);
          line = { tokens: [] };
          cursor = xHang;
          wordsOnLine = 0;
        }
        line.tokens.push({ text: tok.text, bold: tok.bold, x: cursor });
        cursor += w + spaceW;
        wordsOnLine++;
      });
      allLines.push(line);
    });

    const bh = allLines.length * LH + 10;
    check(bh + 4);
    y += 2;
    doc.setCharSpace(0);
    doc.setDrawColor(...C.gold);
    doc.setLineWidth(0.4);
    doc.roundedRect(ml, y, cw, bh, 2, 2, 'D');

    doc.setFont('helvetica','bolditalic');
    doc.setFontSize(8.5);
    rgb(C.goldDark,'text');
    doc.text(contextLabel || 'Context', ml + 4, y + 5.5);

    doc.setFontSize(FS);
    rgb(C.char,'text');
    let by = y + 11;
    allLines.forEach(ln => {
      ln.tokens.forEach(tk => {
        doc.setFont('helvetica', tk.bold ? 'bold' : 'normal');
        doc.text(tk.text, tk.x, by);
      });
      by += LH;
    });

    y += bh + 5;
    doc.setCharSpace(0);
  }

  // ── HELPER: SPEAKER LINE (creator to camera staccato) ───────────
  function speakerLine(text) {
    check(7);
    doc.setFont('helvetica','normal');
    doc.setFontSize(11);
    rgb(C.char,'text');
    const wrapped = doc.splitTextToSize(text, cw);
    for (const wl of wrapped) {
      check(6.5);
      doc.text(wl, ml, y);
      y += 6.5;
    }
  }

  // ── HELPER: BODY TEXT ────────────────────────────────────────
  function bodyText(text) {
    check(6);
    // Defensive: normalize "Core goal:" lines to bold prefix
    let normText = text;
    const coreMatchBT = normText.match(/^(\*\*)?Core goal:(\*\*)?\s*(.+)/i);
    if (coreMatchBT) {
      normText = "**Core goal:** " + coreMatchBT[3].replace(/^\*\*|\*\*$/g, "").trim();
    }
    // Defensive: normalize "Beat:" lines to bold prefix even if Claude omits asterisks
    const beatMatchBT = normText.match(/^(\*\*)?Beat:(\*\*)?\s*(.+)/i);
    if (beatMatchBT && !coreMatchBT) {
      normText = "**Beat:** " + beatMatchBT[3].replace(/^\*\*|\*\*$/g, "").trim();
    }
    const cleanText = stripMarkdownBold(normText);
    const wrapped = doc.splitTextToSize(cleanText, cw);
    doc.setFont('helvetica','normal');
    doc.setFontSize(10);
    rgb(C.char,'text');
    const hasBold = /\*\*[^*]+\*\*/.test(normText);
    if (hasBold) {
      // drawLineWithBold handles its own word-by-word wrapping with bold support
      drawLineWithBold(normText, ml, cw);
      y += 5.5;
    } else {
      // No bold — use jsPDF wrap (faster)
      for (const wl of wrapped) {
        check(6);
        doc.text(wl, ml, y);
        y += 5.5;
      }
    }
    y += 1.5;
  }

  // ── PARSE AND RENDER ─────────────────────────────────────────
  newPage();

  // Skip title and meta (already on cover)
  i; // already advanced past title/meta above

  let inInsight = false, insightBuf = [];
  let inMidCta = false, midCtaBuf = [], midCtaDash = false;
  let inSponsor = false, sponsorBuf = [];
  let speakerMode = false;
  let inHook = false;
  let inFacts = false;
  let inContext = false; let contextBuf = []; let contextLabel = '';
  let lastWasMainBullet = false;
  let finalCloseRendered = false;
  let hookSeen = new Set();
  let inBulletSection = false;

  while (i < lines.length) {
    const raw = lines[i]; i++;
    const t = raw.trim();

    // Skip dividers
    if (/^-{5,}$/.test(t) || /^={5,}$/.test(t)) {
      speakerMode = false;
      if (inInsight) { creatorInsight(insightBuf.join(' ')); inInsight=false; insightBuf=[]; }
      if (inMidCta && midCtaBuf.length) { if (contextBuf.length) { contextBox(contextBuf); contextBuf=[]; inContext=false; y += 3; } midCtaBox(midCtaBuf.join('\n')); inMidCta=false; midCtaBuf=[]; midCtaDash=false; }
      continue;
    }


    // Flush insight buffer if new section starts
    if (inInsight && (t.startsWith('SECTION') || t.startsWith('FINAL') || t.startsWith('MID CTA') || t.startsWith('---') || /^Q[1-9]:/.test(t) || t.startsWith('===') || t === '')) {
      if (t !== '') { creatorInsight(insightBuf.join(' ')); inInsight=false; insightBuf=[]; }
      else { insightBuf.push(''); continue; }
    }
    if (inInsight) { insightBuf.push(t); continue; }

    // Flush mid CTA
    if (inMidCta) {
      if (t === '–' || t === '-') { midCtaDash=true; continue; }
      if (t.startsWith('SECTION') || t.startsWith('FINAL') || t.startsWith('---') || /^Q[1-9]:\s/.test(t) || (t.startsWith('=== ') && t.endsWith(' ==='))) {
        if (contextBuf.length) { contextBox(contextBuf); contextBuf=[]; inContext=false; y += 3; }
        if (midCtaBuf.length) { midCtaBox(midCtaBuf.join('\n')); }
        inMidCta=false; midCtaBuf=[]; midCtaDash=false;
        // fall through
      } else { if(t) midCtaBuf.push(t); continue; }
    }

    if (!t) { y += inHook ? 0 : inContext ? 0 : speakerMode ? 1.5 : 3; continue; }
    // Skip QC meta-commentary lines Claude sometimes prepends
    if (/^(Let me |I will |I have |Here is the |I've )/i.test(t) && t.length < 120 && !t.includes('●')) { continue; }

    // Section headers
    if (t.startsWith('=== ') && t.endsWith(' ===')) { lastWasMainBullet=false; if (contextBuf.length) { contextBox(contextBuf); contextBuf=[]; inContext=false; } const lbl = t.replace(/===/g,'').trim(); if (lbl === 'MAIN CONTENT') { speakerMode=false; continue; } if (lbl === 'OUTRO') { if (inSponsor && sponsorBuf.length) { sponsorBox(sponsorBuf.join('\n')); inSponsor=false; sponsorBuf=[]; } sectionHeader('FINAL CLOSE'); speakerMode=false; inHook=false; inBulletSection=false; inFacts=false; finalCloseRendered=true; continue; } if (lbl === 'SPONSOR') { inSponsor=true; speakerMode=false; inHook=false; inBulletSection=false; inFacts=false; continue; } if (inSponsor && sponsorBuf.length) { sponsorBox(sponsorBuf.join('\n')); inSponsor=false; sponsorBuf=[]; } sectionHeader(t); speakerMode=false; inBulletSection=false; inFacts=false; if (lbl === 'HOOK') { inHook=true; } else { inHook=false; } continue; }
    if (/^(OPENING HOOK|HOOK)$/.test(t)) { if (!inHook) { sectionHeader(t); } speakerMode=false; inHook=true; inBulletSection=false; inFacts=false; continue; }
    if (/^SECTION \d+:/.test(t)) { lastWasMainBullet=false; if (contextBuf.length) { contextBox(contextBuf); } inContext=false; contextBuf=[]; if (inSponsor && sponsorBuf.length) { sponsorBox(sponsorBuf.join('\n')); inSponsor=false; sponsorBuf=[]; } sectionHeader(t); speakerMode=false; inHook=false; inBulletSection=false; inFacts=false; continue; }
    if (/^Q[1-9]:\s/.test(t)) { if (contextBuf.length) { contextBox(contextBuf); } inContext=false; contextBuf=[]; if (inSponsor && sponsorBuf.length) { sponsorBox(sponsorBuf.join('\n')); inSponsor=false; sponsorBuf=[]; } sectionHeader(t); speakerMode=false; inHook=false; inBulletSection=false; inFacts=false; continue; }
    if (/^FINAL CLOSE/.test(t)) { if (contextBuf.length) { contextBox(contextBuf); } inContext=false; contextBuf=[]; if (!finalCloseRendered) { sectionHeader(t); finalCloseRendered=true; } speakerMode=false; continue; }
    if (/^OUTRO$/.test(t)) { speakerMode=false; continue; }
    if (/^MAIN CONTENT$/.test(t)) { speakerMode=false; continue; }

    // Sponsor buffer — after section headers (so flush triggers work), before everything else
    if (inSponsor) { if (t) sponsorBuf.push(t); continue; }

    // MID CTA header
    if (t === 'MID CTA' || t.startsWith('MID CTA ')) { if (t.startsWith('MID CTA ')) { midCtaBuf.push(t.slice('MID CTA '.length).trim()); } inMidCta=true; continue; }

    // Speaker label — generic: matches any 'NAME (to camera):'
    if (/^[A-Z][A-Z .'-]+ \(to camera\):?$/.test(t)) {
      check(8);
      doc.setFont('helvetica','bold'); doc.setFontSize(9);
      rgb(C.goldDark,'text');
      doc.text(t.replace(/:$/,'') + ':', ml, y);
      y += 7; speakerMode=true; continue;
    }

    // Sub labels — skip "Talking points:" / "Action steps:" / "Context if needed:" entirely.
    // Bullets read directly under the section header, no extra label noise.
    // Context block start — collect open-circle bullets until next section/divider/whiteboard
    const ctxHdr = t.match(/^Context (?:if needed|Question ([12])):?$/i);
    if (ctxHdr) {
      if (contextBuf.length) { contextBox(contextBuf); contextBuf = []; y -= 4; }
      inContext = true;
      contextLabel = ctxHdr[1] ? ('Context Question ' + ctxHdr[1]) : 'Context';
      continue;
    }
    if (/^(Talking points|Action steps):?$/.test(t)) { continue; }

    // Creator's insight
    if (/^[^:']+'?s insight:?/i.test(t)) {
      inInsight=true;
      insightBuf=[t.replace(/^[^:']+'?s insight:\s*/i,'')];
      continue;
    }

    // Whiteboard
    // Open-circle bullet — Context block content (collect, don't render yet — render at section boundary)
    if (inContext && /^\u25cb/.test(t)) { contextBuf.push(t.replace(/^[\u25cb\s]+/, '')); continue; }
    // Non-○ line while inContext — close collection state but DON'T flush yet (defer to section boundary so whiteboard can render in between if Claude reordered)
    if (inContext && !/^\u25cb/.test(t)) { inContext = false; }
    if (/^Whiteboard example:/i.test(t)) { whiteboard(t); continue; }

    // Facts block — detect and render as plain prose, ignoring leading bullets/dashes
    {
      // Strip any leading bullet/dash/dot markers to test for Facts label
      const stripped = t.replace(/^[\u25cf\u2022\-\u2013\u2014\.\s]+/, '');
      if (/^\*\*Facts about/i.test(stripped)) {
        // First line of Facts block — bold label, with extra blank line above for separation
        y += 6;
        check(10);
        bodyText(stripped);
        inFacts = true;
        continue;
      }
      if (inFacts) {
        // Continuation line of Facts block — strip leading bullet markers, render as prose
        if (stripped.length === 0) { continue; }
        bodyText(stripped);
        continue;
      }
    }

    // Bullets
    if (/^[-–—]+$/.test(t)) { continue; }
    // Direction-line (legacy, indented prose right after a • main bullet) indented prose line right after a • main bullet (no bullet marker)
    // Trigger conditions: (a) previous rendered element was a main bullet, (b) raw line has leading whitespace, (c) line isn't section header / divider / new bullet / Context trigger
    if (lastWasMainBullet && /^\s{2,}/.test(raw) && t && !/^[●•\-\u25cf\u25cb]/.test(t) && !/^Context/i.test(t) && !/^SECTION/i.test(t) && !/^Whiteboard/i.test(t) && !/^---/.test(t)) {
      subBullet(t);
      lastWasMainBullet = false;
      continue;
    }
    // Legacy: en-dash sub-bullet (still supported for backward compat, treated as direction-line)
    if (/^\u2013\s/.test(t)) { subBullet(t); lastWasMainBullet = false; continue; }
    if (/^[●•\-\u25cf]/.test(t)) { bullet(t); inBulletSection=true; lastWasMainBullet = true; continue; }

    // CTA subscribe lines — skip subscribe, render "If you want" as gold border
    if ((t.toLowerCase().includes('cta')) && t.length < 180 && !t.startsWith('Section')) { continue; }

    // Speaker mode staccato lines
    if (speakerMode) {
      if (t === 'Watch that next.' || t === 'Watch that next') { continue; }
      speakerLine(t); continue;
    }

    // Default body — deduplicate within hook (relaxed)
    if (inHook) {
      if (/^HOOK:/i.test(t)) continue;
      const key = t.trim().toLowerCase();
      if (hookSeen.has(key)) continue;
      hookSeen.add(key);
    }
    // If we are inside a bullet-style section, render bridge/loose lines as bullets so style stays consistent
    if (inBulletSection && !inHook) { bullet('● ' + t); continue; }
    bodyText(t);
  }

  // Flush any remaining
  if (inInsight && insightBuf.length) creatorInsight(insightBuf.join(' '));
  if (inMidCta && midCtaBuf.length) { if (contextBuf.length) { contextBox(contextBuf); contextBuf=[]; y += 3; } midCtaBox(midCtaBuf.join('\n')); }
  if (inSponsor && sponsorBuf.length) sponsorBox(sponsorBuf.join('\n'));

  // (MAIN IDEA now lives on cover — no separate page)

  // ── UPDATE ALL FOOTERS ──────────────────────────────────────
  const total = doc.internal.getNumberOfPages();
  for (let p = 2; p <= total; p++) {
    doc.setPage(p);
    hline(ph-14, C.light, 0.3);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.setCharSpace(1);
    rgb(C.muted,'text');
    doc.text('CONTENT CARTEL  ·  CONFIDENTIAL', ml, ph-8);
    doc.setCharSpace(0);
    doc.text(`${p-1} / ${total-1}`, pw-mr, ph-8, {align:'right'});
  }

  doc.save((filename||'script')+'.pdf');
}

// ── Download an image url as a file (blob, falls back to opening the url) ──
function downloadImageFile(url, filename) {
  return fetch(url).then(res => res.blob()).then(blob => {
    const obj = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = obj; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(obj), 1000);
  }).catch(() => window.open(url, "_blank"));
}
function thumbFilename(img) {
  const base = ((img.overlay_words || "thumbnail").trim().replace(/[^a-zA-Z0-9]+/g, "-").toLowerCase() || "thumbnail");
  return base + (img.concept_id ? "-" + img.concept_id : "") + ".png";
}

// ── Compact title picker: choose one of the 5 generated titles right after generation ──
function TitlePicker({ run, onPicked }) {
  const [busy, setBusy] = useState(false);
  const [saved, setSaved] = useState(null);
  const [err, setErr] = useState(false);
  const variants = Array.isArray(run && run.title_variants) ? run.title_variants : [];
  if (!run || !variants.length) return null;
  const current = (saved || run.video_title || "").toLowerCase();
  async function pick(title) {
    if (!title || busy) return;
    setBusy(true); setErr(false);
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 60000);
    try {
      const res = await fetch(CONFIG.titlePickWebhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ run_id: run.id, title }),
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error("title pick failed: HTTP " + res.status);
      const data = await res.json();
      if (!data || !data.ok) throw new Error("title pick returned no ok");
      setSaved(title);
      if (typeof onPicked === "function") onPicked(title);
    } catch (e) {
      console.error("[title-pick] error:", e);
      setErr(true);
    } finally {
      clearTimeout(timer);
      setBusy(false);
    }
  }
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
      {err && <div style={{ fontSize:12, color:T.red }}>Saving title failed. Try again.</div>}
      {variants.map(v => {
        const isCurrent = v.title && v.title.toLowerCase() === current;
        return (
          <div key={v.n} style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 12px", background:isCurrent?T.goldBg:T.surface, border:`1px solid ${isCurrent?T.gold:T.border}`, borderRadius:9 }}>
            <span style={{ flexShrink:0, fontSize:10, fontWeight:700, color:isCurrent?T.goldDark:T.muted, letterSpacing:"0.05em" }}>{isCurrent ? "\u2605" : "V"+v.n}</span>
            <div style={{ flex:1, minWidth:0, fontSize:13, fontWeight:isCurrent?600:400, color:T.char, lineHeight:1.35 }}>{v.title}</div>
            {!isCurrent && <button onClick={() => pick(v.title)} disabled={busy} style={{ flexShrink:0, fontSize:11, fontWeight:600, color:"#fff", background:busy?T.muted:T.goldDark, border:"none", padding:"5px 11px", borderRadius:6, cursor:busy?"default":"pointer", fontFamily:"'DM Sans',sans-serif", letterSpacing:"0.03em" }}>{busy ? "Saving\u2026" : "Use this"}</button>}
          </div>
        );
      })}
    </div>
  );
}

              {status==="loading" ? "Generating..." : mode === "multiple" ? `Generate ${multiList.length} scripts →` : "Generate Script →"}
            </button>
            {canGenerate && status !== "loading" && status !== "success" && <div style={{ fontSize:12, color:T.muted, textAlign:"center", marginTop:8 }}>Takes about {mode === "multiple" ? multiList.length * 2 : 2} minutes</div>}
            {status === "loading" && (() => {
  const steps = ['Hook','Script','Quality','Polish','Done'];
  const elapsed = Math.round(pollCount*5/60*10)/10 || 0;
  const stepIndex = Math.min(Math.floor(pollCount / 3), steps.length - 1);
  const clientName = clients.find(c=>c.client_slug===generatingSlugRef.current)?.client_name || generatingSlugRef.current;
  return (
    <div style={{ marginTop:16, background:T.goldBg, border:`1px solid ${T.goldLight}`, borderRadius:14, padding:'18px 20px', boxShadow:'0 4px 20px rgba(196,151,63,0.12)' }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>

        </div>
        <span style={{ fontSize:12, color:T.goldDark, fontWeight:500, opacity:0.75 }}>{elapsed} min</span>
      </div>
      <div style={{ display:'flex', gap:4, alignItems:'center' }}>
        {steps.map((s, i) => (
          <React.Fragment key={s}>
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4 }}>
              <div style={{ width:28, height:28, borderRadius:'50%', background: i < stepIndex ? T.gold : i === stepIndex ? T.goldBg : 'transparent', border:`1.5px solid ${i <= stepIndex ? T.gold : T.goldLight}`, display:'flex', alignItems:'center', justifyContent:'center', transition:'all 0.4s' }}>
                {i < stepIndex
                  ? <span style={{ fontSize:11, color:'#fff' }}>✓</span>
                  : i === stepIndex
                  ? <div style={{ width:6, height:6, borderRadius:'50%', background:T.gold, animation:'ps-pulse 1s ease-in-out infinite' }} />
                  : null}
              </div>
              <span style={{ fontSize:9, color: i <= stepIndex ? T.goldDark : T.muted, fontWeight: i === stepIndex ? 600 : 400, letterSpacing:'0.04em', textTransform:'uppercase' }}>{s}</span>
            </div>
            {i < steps.length - 1 && <div style={{ flex:1, height:1.5, background: i < stepIndex ? T.gold : T.goldLight, marginBottom:16, transition:'background 0.4s' }} />}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
})()}
            {status === "success" && runData && null /* success now rendered at top of panel */}
            {status === "timeout" && <div style={{ marginTop:14, padding:"14px 18px", background:"#FDF0F0", borderRadius:10, fontSize:13, color:T.red }}>Timeout after 4 minutes. Check n8n executions.</div>}
            {status === "error" && <div style={{ marginTop:14, padding:"14px 18px", background:"#FDF0F0", borderRadius:10, fontSize:13, color:T.red }}>Something went wrong. Check the n8n execution log.</div>}
          </div>

          </>)}
        </div>
        )}
      </div>
    </div>
  );
}
