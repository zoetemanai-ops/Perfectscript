// ── CLIENTS VIEW ──────────────────────────────────────────────
function ClientsView({ clients, onReload, db, toast, editClient, setEditClient }) {
  const [delId, setDelId] = useState(null);
  const [selectedSlug, setSelectedSlug] = useState("");
  const sortedClients = [...clients].sort((a, b) => a.client_name.localeCompare(b.client_name));

  async function saveClient(data) {
    try {
      if (data.id) { const { id, created_at, updated_at, ...rest } = data; await db.patch("client_profiles", id, rest); }
      else { const { id, created_at, updated_at, ...rest } = data; await db.post("client_profiles", rest); }
      setEditClient(null); setSelectedSlug(""); onReload(); toast("Saved", "success");
    } catch(e) { toast("Save failed: " + e.message, "error"); }
  }

  async function deleteClient(id) {
    try { await db.del("client_profiles", id); setDelId(null); setEditClient(null); setSelectedSlug(""); onReload(); toast("Deleted", "success"); }
    catch(e) { toast("Failed: " + e.message, "error"); }
  }

  // When user picks a client from dropdown, open their edit panel directly
  function handleSelect(slug) {
    setSelectedSlug(slug);
    if (slug) {
      const client = clients.find(c => c.client_slug === slug);
      if (client) setEditClient(client);
    }
  }

  // When edit panel closes, reset the selector so user lands back on chooser
  function handleClose() {
    setEditClient(null);
    setSelectedSlug("");
  }

  return (
    <div className="page">
      <div style={{ marginTop:-24, marginLeft:-16, marginBottom:48 }}>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:68, fontWeight:300, color:T.char, lineHeight:0.92, letterSpacing:"-0.02em" }}>Your<br/><span style={{ fontStyle:"italic", color:T.gold }}>clients.</span></div>
      </div>

      <div style={{ maxWidth:720, margin:"0 auto" }}>
        <div style={{ fontSize:14, color:T.muted, marginBottom:24, lineHeight:1.5 }}>Pick a client to edit their profile, or create a new one below.</div>
        <div style={{ marginBottom:24 }}>
          <div style={{ fontSize:13, fontWeight:600, color:T.text, letterSpacing:"0.06em", textTransform:"uppercase", marginBottom:10 }}>Select a client to edit <span style={{ fontWeight:500, textTransform:"none", letterSpacing:0, fontSize:14, color:T.gold, marginLeft:4 }}>– {clients.length} total</span></div>
          {clients.length === 0
            ? <div style={{ padding:"24px 20px", background:T.surface, borderRadius:12, border:`1px solid ${T.border}`, textAlign:"center", fontSize:14, color:T.muted }}>No clients yet. Add your first one below.</div>
            : <SearchableSelect
                value={selectedSlug}
                onChange={handleSelect}
                options={sortedClients.map(c => ({ value: c.client_slug, label: c.client_name + (c.active ? "" : " (paused)") }))}
                placeholder="— Choose a client —"
              />
          }
        </div>

        <div style={{ display:"flex", justifyContent:"center", marginTop:32 }}>
          <Btn variant="gold" onClick={() => setEditClient({})} style={{ padding:"14px 32px", fontSize:14 }}>+ Add New Client</Btn>
        </div>
      </div>

      {editClient !== null && <ClientPanel client={editClient} onClose={handleClose} onSave={saveClient} onDelete={editClient.id ? () => setDelId(editClient.id) : null} />}

      {delId && ReactDOM.createPortal(
        <div style={{ position:"fixed", inset:0, background:"rgba(20,17,15,0.5)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:400 }}>
          <div style={{ background:T.surface, borderRadius:20, padding:"48px 56px", maxWidth:400, textAlign:"center", boxShadow:"0 16px 80px rgba(28,25,23,0.2)" }}>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:32, fontWeight:300, color:T.char, marginBottom:12 }}>Delete client?</div>
            <div style={{ fontSize:14, color:T.muted, marginBottom:36, lineHeight:1.7 }}>The profile will be permanently removed. Script run history is kept.</div>
            <div style={{ display:"flex", gap:12 }}>
              <Btn variant="ghost" onClick={() => setDelId(null)} style={{ flex:1, padding:"12px" }}>Cancel</Btn>
              <Btn variant="danger" onClick={() => deleteClient(delId)} style={{ flex:1, padding:"12px" }}>Delete</Btn>
            </div>
          </div>
        </div>
      , document.body)}
    </div>
  );
}

// ── HISTORY VIEW ──────────────────────────────────────────────
function HistoryView({ runs, onReload }) {
  const [search, setSearch] = useState("");
  const [page, setPage] = useState(1);
  const [refreshing, setRefreshing] = useState(false);
  const [thumbsByRun, setThumbsByRun] = useState({}); // script_run_id -> latest complete thumbnail_run
  const [thumbBusy, setThumbBusy] = useState({});     // script_run_id -> bool (regen in flight)
  const [thumbErr, setThumbErr] = useState({});       // script_run_id -> bool
  const [expanded, setExpanded] = useState(null);     // script_run_id currently expanded
  const [titlesByRun, setTitlesByRun] = useState({}); // script_run_id -> latest title regen result
  const [titleBusy, setTitleBusy] = useState({});     // script_run_id -> bool (regen in flight)
  const [titleErr, setTitleErr] = useState({});       // script_run_id -> bool
  const [titleOpen, setTitleOpen] = useState(null);   // script_run_id with titles panel open
  const [copiedKey, setCopiedKey] = useState(null);   // "runId:variantN" of last copied title
  const [pickBusy, setPickBusy] = useState({});       // script_run_id -> bool (title pick in flight)
  const [pickedKey, setPickedKey] = useState(null);   // "runId:title" of last saved pick
  const [pickErr, setPickErr] = useState({});         // script_run_id -> bool
  const PAGE_SIZE = 25;
  const filtered = runs.filter(r => {
    const q = search.toLowerCase();
    const matchSearch = !q || (r.video_title||r.topic||"").toLowerCase().includes(q) || (r.client_name||"").toLowerCase().includes(q);
    if (!matchSearch) return false;
    // Hide failed runs — keep recent runs without output (still running) visible
    const hasOutput = r.doc_url || r.full_script;
    if (hasOutput) return true;
    const ageMs = r.created_at ? Date.now() - new Date(r.created_at).getTime() : 0;
    const isRecent = ageMs > 0 && ageMs < 10 * 60 * 1000;
    return isRecent;
  });
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const paginated = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  function handleSearch(val) { setSearch(val); setPage(1); }

  // ── Batch-load the latest complete thumbnail_run for every visible run (one query per page) ──
  const pageThumbIds = paginated.filter(r => r.doc_url || r.full_script).map(r => r.id);
  const pageThumbKey = pageThumbIds.join(",");
  useEffect(() => {
    if (!pageThumbIds.length) return;
    let cancelled = false;
    (async () => {
      try {
        const db = sb(CONFIG.supabaseUrl, CONFIG.supabaseKey);
        const rows = await db.get("thumbnail_runs",
          `?script_run_id=in.(${pageThumbIds.join(",")})&status=eq.complete&select=id,script_run_id,images,video_title,created_at&order=created_at.desc`
        );
        if (cancelled || !Array.isArray(rows)) return;
        setThumbsByRun(prev => {
          const next = { ...prev };
          for (const row of rows) {
            const sid = row.script_run_id;
            // rows are desc by created_at, so first seen = latest; never downgrade a newer local entry
            if (!next[sid] || new Date(row.created_at) >= new Date(next[sid].created_at)) next[sid] = row;
          }
          return next;
        });
      } catch (e) { console.error("[hist-thumb] batch load error:", e); }
    })();
    return () => { cancelled = true; };
  }, [pageThumbKey]);

  // ── Regenerate thumbnails for one run: trigger Vercel fn, poll thumbnail_runs until complete ──
  function regenerateThumb(runId) {
    setThumbBusy(p => ({ ...p, [runId]: true }));
    setThumbErr(p => ({ ...p, [runId]: false }));
    (async () => {
      try {
        const res = await fetch("/api/generate-thumbnail", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ script_run_id: runId })
        });
        if (!res.ok) throw new Error("trigger failed: HTTP " + res.status);
        const { thumbnail_run_id } = await res.json();
        const db = sb(CONFIG.supabaseUrl, CONFIG.supabaseKey);
        let attempts = 0;
        const timer = setInterval(async () => {
          attempts++;
          try {
            const rows = await db.get("thumbnail_runs", `?id=eq.${thumbnail_run_id}&limit=1`);
            const row = Array.isArray(rows) ? rows[0] : null;
            if (row && row.status === "complete") {
              clearInterval(timer);
              setThumbsByRun(p => ({ ...p, [runId]: row }));
              setThumbBusy(p => ({ ...p, [runId]: false }));
              setExpanded(runId);
            } else if (row && row.status === "error") {
              clearInterval(timer);
              console.error("[hist-thumb] run error:", row.error);
              setThumbBusy(p => ({ ...p, [runId]: false }));
              setThumbErr(p => ({ ...p, [runId]: true }));
            }
          } catch (e) { console.error("[hist-thumb] poll error:", e); }
          if (attempts > 90) { clearInterval(timer); setThumbBusy(p => ({ ...p, [runId]: false })); setThumbErr(p => ({ ...p, [runId]: true })); }
        }, 5000);
      } catch (e) {
        console.error("[hist-thumb] error:", e);
        setThumbBusy(p => ({ ...p, [runId]: false }));
        setThumbErr(p => ({ ...p, [runId]: true }));
      }
    })();
  }

  // ── Regenerate titles for one run: synchronous call to the Title Regen n8n webhook ──
  function regenerateTitles(runId) {
    setTitleBusy(p => ({ ...p, [runId]: true }));
    setTitleErr(p => ({ ...p, [runId]: false }));
    (async () => {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 180000); // 3 min hard cap
      try {
        const res = await fetch(CONFIG.titleWebhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ run_id: runId }),
          signal: ctrl.signal
        });
        if (!res.ok) throw new Error("title regen failed: HTTP " + res.status);
        const data = await res.json();
        if (!data || !data.final_title) throw new Error("title regen returned no final_title");
        setTitlesByRun(p => ({ ...p, [runId]: data }));
        setTitleOpen(runId);
      } catch (e) {
        console.error("[hist-title] error:", e);
        setTitleErr(p => ({ ...p, [runId]: true }));
      } finally {
        clearTimeout(timer);
        setTitleBusy(p => ({ ...p, [runId]: false }));
      }
    })();
  }

  function copyTitle(runId, key, text) {
    try { navigator.clipboard.writeText(text); } catch (e) {}
    setCopiedKey(runId + ":" + key);
    setTimeout(() => setCopiedKey(k => (k === runId + ":" + key ? null : k)), 1600);
  }

  // ── Pick a title: n8n webhook updates video_title in Supabase and swaps the title line in the Google Doc ──
  function pickTitle(runId, title) {
    if (!title || pickBusy[runId]) return;
    setPickBusy(p => ({ ...p, [runId]: true }));
    setPickErr(p => ({ ...p, [runId]: false }));
    (async () => {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 60000);
      try {
        const res = await fetch(CONFIG.titlePickWebhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ run_id: runId, title }),
          signal: ctrl.signal
        });
        if (!res.ok) throw new Error("title pick failed: HTTP " + res.status);
        const data = await res.json();
        if (!data || !data.ok) throw new Error("title pick returned no ok");
        setPickedKey(runId + ":" + title);
        setTitlesByRun(p => (p[runId] ? { ...p, [runId]: { ...p[runId], final_title: title } } : p));
        if (typeof onReload === "function") onReload();
      } catch (e) {
        console.error("[title-pick] error:", e);
        setPickErr(p => ({ ...p, [runId]: true }));
      } finally {
        clearTimeout(timer);
        setPickBusy(p => ({ ...p, [runId]: false }));
      }
    })();
  }

  async function downloadAll(images) {
    for (let i = 0; i < images.length; i++) {
      await downloadImageFile(images[i].url, thumbFilename(images[i]));
      await new Promise(res => setTimeout(res, 350)); // stagger so the browser allows multiple downloads
    }
  }

  return (
    <div className="page">
      <div style={{ marginTop:-24, marginLeft:-16, marginBottom:32, display:"flex", justifyContent:"space-between", alignItems:"flex-end", gap:24 }}>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:68, fontWeight:300, color:T.char, lineHeight:0.92, letterSpacing:"-0.02em" }}>Run<br/><span style={{ fontStyle:"italic", color:T.gold }}>history.</span></div>
        <div style={{ flexShrink:0, paddingBottom:8 }}>
          <Btn variant="ghost" disabled={refreshing} onClick={async () => { setRefreshing(true); await onReload(); setRefreshing(false); }}>{refreshing ? "Refreshing..." : "↻ Refresh"}</Btn>
        </div>
      </div>

      <div style={{ marginBottom:20, border:`2px solid ${search?T.gold:T.border}`, borderRadius:12, background:search?T.goldBg:T.surface2, boxShadow:search?"0 2px 12px rgba(196,151,63,0.1)":"none", transition:"all 0.15s", display:"flex", alignItems:"center", padding:"0 18px" }}>
        <span style={{ fontSize:16, color:T.muted, marginRight:12, flexShrink:0 }}>🔍</span>
        <input value={search} onChange={e=>handleSearch(e.target.value)} placeholder="Search by title or client..." style={{ flex:1, padding:"14px 0", border:"none", fontSize:15, color:T.text, background:"transparent", outline:"none", fontFamily:"'DM Sans',sans-serif", fontWeight:500 }} />
      </div>

      <div style={{ fontSize:14, color:T.muted, marginBottom:24 }}>{filtered.length} script{filtered.length===1?"":"s"}</div>

      <div style={{ background:T.surface2, borderRadius:16, border:`1px solid ${T.border}`, overflow:"hidden", boxShadow:"0 4px 24px rgba(0,0,0,0.06)" }}>
        <table style={{ width:"100%", borderCollapse:"collapse" }}>
          <thead>
            <tr style={{ background:T.bg }}>
              {["Client","Title","Date","Download","Thumbnail","Titles"].map((h,i) => (
                <th key={i} style={{ padding:"15px 22px", textAlign:"left", fontSize:13, fontWeight:600, color:T.text, letterSpacing:"0.07em", textTransform:"uppercase", borderBottom:`1px solid ${T.border}` }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {paginated.map((r,i) => {
              const ageMs = r.created_at ? Date.now() - new Date(r.created_at).getTime() : 0;
              const isRecent = ageMs > 0 && ageMs < 10 * 60 * 1000; // <10 minutes
              const hasOutput = r.doc_url || r.full_script;
              const isRunning = isRecent && !hasOutput && (r.status === "running" || r.status === "pending" || !r.status);
              const isFailed = !hasOutput && !isRunning;
              const rowClickable = !!r.doc_url;
              const thumb = thumbsByRun[r.id];
              const busy = !!thumbBusy[r.id];
              const errored = !!thumbErr[r.id];
              const isExpanded = expanded === r.id;
              const images = (thumb && Array.isArray(thumb.images)) ? thumb.images : [];
              const storedTitles = (!titlesByRun[r.id] && Array.isArray(r.title_variants) && r.title_variants.length) ? { variants: r.title_variants, final_title: r.video_title || "", generated_at: r.completed_at || r.created_at, stored: true } : null;
              const titleRes = titlesByRun[r.id] || storedTitles;
              const canPick = r.triggered_by === "webhook";
              const tBusy = !!titleBusy[r.id];
              const tErrored = !!titleErr[r.id];
              const isTitleOpen = titleOpen === r.id;
              const isLast = i === paginated.length - 1;
              return (
                <React.Fragment key={r.id}>
                <tr className={rowClickable ? "history-row" : ""} onClick={rowClickable ? () => window.open(r.doc_url, "_blank") : undefined} style={{ borderBottom:(!isExpanded && !isLast)?`1px solid ${T.borderL}`:"none", cursor:rowClickable?"pointer":"default" }}>
                  <td style={{ padding:"22px 22px", fontSize:15, fontWeight:500, color:T.char, whiteSpace:"nowrap" }}>{r.client_name}</td>
                  <td style={{ padding:"22px 22px", maxWidth:340 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <div style={{ flex:1, minWidth:0, fontSize:16, fontWeight:500, color:T.char, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.video_title || (r.full_script ? r.full_script.split('\n').find(l => l.trim()) : null) || "—"}</div>
                      {isFailed && <Badge color="neutral">Failed</Badge>}
                      {isRunning && <Badge color="gold">Running</Badge>}
                    </div>
                  </td>
                  <td style={{ padding:"22px 22px", fontSize:14, color:T.muted, whiteSpace:"nowrap" }}>
                    {r.created_at ? new Date(r.created_at).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "—"}
                  </td>
                  <td style={{ padding:"22px 22px" }}>
                    <div style={{ display:"flex", gap:16, alignItems:"center" }}>
                      {r.doc_url && <a href={r.doc_url} target="_blank" onClick={e=>e.stopPropagation()} style={{ fontSize:14, fontWeight:500, color:T.gold, textDecoration:"none" }}>Docs →</a>}
                      {r.full_script && <button onClick={e => { e.stopPropagation(); downloadPDF(r.full_script, r.doc_title || r.video_title || 'script', r.video_title, r.main_idea || r.topic); }} className="pdf-btn" style={{ fontSize:13, fontWeight:600, color:T.gold, background:"transparent", border:`1px solid ${T.gold}`, borderRadius:8, padding:"6px 14px", cursor:"pointer", letterSpacing:"0.02em", fontFamily:"'DM Sans',sans-serif", transition:"all 0.15s", display:"inline-flex", alignItems:"center", gap:6 }}>↓ PDF</button>}
                      {!hasOutput && <span style={{ fontSize:14, color:T.muted }}>—</span>}
                    </div>
                  </td>
                  <td style={{ padding:"22px 22px" }} onClick={e => e.stopPropagation()}>
                    {!hasOutput ? (
                      <span style={{ fontSize:14, color:T.muted }}>—</span>
                    ) : busy ? (
                      <span style={{ fontSize:13, color:T.muted, display:"inline-flex", alignItems:"center", gap:7 }}><span className="thumb-spin" style={{ width:12, height:12, border:`2px solid ${T.border}`, borderTopColor:T.gold, borderRadius:"50%", display:"inline-block", animation:"spin 0.7s linear infinite" }} />Generating…</span>
                    ) : (thumb && images.length) ? (
                      <div style={{ display:"flex", gap:10, alignItems:"center" }}>
                        <button onClick={() => setExpanded(isExpanded ? null : r.id)} style={{ fontSize:13, fontWeight:600, color:T.gold, background:"transparent", border:`1px solid ${T.gold}`, borderRadius:8, padding:"6px 13px", cursor:"pointer", letterSpacing:"0.02em", fontFamily:"'DM Sans',sans-serif", display:"inline-flex", alignItems:"center", gap:6 }}>{isExpanded ? "Hide thumbnails" : "View thumbnails"}</button>
                        <button onClick={() => regenerateThumb(r.id)} style={{ fontSize:13, fontWeight:600, color:T.muted, background:"transparent", border:`1px solid ${T.border}`, borderRadius:8, padding:"6px 13px", cursor:"pointer", fontFamily:"'DM Sans',sans-serif", letterSpacing:"0.02em" }}>Generate new</button>
                      </div>
                    ) : (
                      <button onClick={() => regenerateThumb(r.id)} style={{ fontSize:13, fontWeight:600, color:errored?T.red:T.goldDark, background:errored?"transparent":T.goldBg, border:errored?`1px solid ${T.red}`:"none", borderRadius:8, padding:"6px 14px", cursor:"pointer", letterSpacing:"0.02em", fontFamily:"'DM Sans',sans-serif" }}>{errored ? "Try again" : "Generate thumbnails"}</button>
                    )}
                  </td>
                  <td style={{ padding:"22px 22px" }} onClick={e => e.stopPropagation()}>
                    {!r.full_script ? (
                      <span style={{ fontSize:14, color:T.muted }}>—</span>
                    ) : tBusy ? (
                      <span style={{ fontSize:13, color:T.muted, display:"inline-flex", alignItems:"center", gap:7 }}><span className="thumb-spin" style={{ width:12, height:12, border:`2px solid ${T.border}`, borderTopColor:T.gold, borderRadius:"50%", display:"inline-block", animation:"spin 0.7s linear infinite" }} />Generating…</span>
                    ) : titleRes ? (
                      <div style={{ display:"flex", gap:10, alignItems:"center" }}>
                        <button onClick={() => setTitleOpen(isTitleOpen ? null : r.id)} style={{ fontSize:13, fontWeight:600, color:T.gold, background:"transparent", border:`1px solid ${T.gold}`, borderRadius:8, padding:"6px 13px", cursor:"pointer", letterSpacing:"0.02em", fontFamily:"'DM Sans',sans-serif" }}>{isTitleOpen ? "Hide titles" : "View titles"}</button>
                        <button onClick={() => regenerateTitles(r.id)} style={{ fontSize:13, fontWeight:600, color:T.muted, background:"transparent", border:`1px solid ${T.border}`, borderRadius:8, padding:"6px 13px", cursor:"pointer", fontFamily:"'DM Sans',sans-serif", letterSpacing:"0.02em" }}>Generate new</button>
                      </div>
                    ) : (
                      <button onClick={() => regenerateTitles(r.id)} style={{ fontSize:13, fontWeight:600, color:tErrored?T.red:T.goldDark, background:tErrored?"transparent":T.goldBg, border:tErrored?`1px solid ${T.red}`:"none", borderRadius:8, padding:"6px 14px", cursor:"pointer", letterSpacing:"0.02em", fontFamily:"'DM Sans',sans-serif" }}>{tErrored ? "Try again" : "Generate titles"}</button>
                    )}
                  </td>
                </tr>
                {isExpanded && images.length > 0 && (
                  <tr style={{ borderBottom:isLast?"none":`1px solid ${T.borderL}` }}>
                    <td colSpan={6} style={{ padding:"4px 22px 26px", background:T.surface }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, flexWrap:"wrap", gap:12 }}>
                        <span style={{ fontSize:12, fontWeight:600, color:T.muted, letterSpacing:"0.06em", textTransform:"uppercase" }}>Latest version{thumb.created_at ? " · " + new Date(thumb.created_at).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : ""}</span>
                        <div style={{ display:"flex", gap:10 }}>
                          <button onClick={() => downloadAll(images)} style={{ fontSize:13, fontWeight:600, color:T.goldDark, background:T.goldBg, border:"none", borderRadius:8, padding:"7px 15px", cursor:"pointer", fontFamily:"'DM Sans',sans-serif", letterSpacing:"0.02em" }}>↓ Download all</button>
                          <button onClick={() => regenerateThumb(r.id)} style={{ fontSize:13, fontWeight:600, color:T.goldDark, background:"transparent", border:`1.5px solid ${T.gold}`, borderRadius:8, padding:"7px 15px", cursor:"pointer", fontFamily:"'DM Sans',sans-serif", letterSpacing:"0.02em" }}>Generate new</button>
                        </div>
                      </div>
                      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(220px, 1fr))", gap:14 }}>
                        {images.map(img => (
                          <div key={img.concept_id || img.url} style={{ border:`1.5px solid ${T.border}`, borderRadius:12, overflow:"hidden", background:T.surface2 }}>
                            <a href={img.url} target="_blank" rel="noopener noreferrer" style={{ display:"block", position:"relative" }}>
                              <img src={img.url} alt={img.overlay_words || "thumbnail"} style={{ width:"100%", display:"block", aspectRatio:"16/9", objectFit:"cover" }} />
                              {img.concept_id && <span style={{ position:"absolute", top:8, left:8, background:"rgba(10,8,6,0.78)", color:"#fff", fontSize:11, fontWeight:600, padding:"2px 8px", borderRadius:5, letterSpacing:"0.05em" }}>{img.concept_id}</span>}
                            </a>
                            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:10, padding:"10px 12px" }}>
                              <span style={{ fontSize:13, color:T.text, fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{img.overlay_words || "—"}</span>
                              <button onClick={() => downloadImageFile(img.url, thumbFilename(img))} style={{ flexShrink:0, fontSize:12, fontWeight:600, color:T.goldDark, background:T.goldBg, border:"none", padding:"6px 13px", borderRadius:6, cursor:"pointer", fontFamily:"'DM Sans',sans-serif", letterSpacing:"0.03em" }}>Download</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </td>
                  </tr>
                )}
                {isTitleOpen && titleRes && (
                  <tr style={{ borderBottom:isLast?"none":`1px solid ${T.borderL}` }}>
                    <td colSpan={6} style={{ padding:"4px 22px 26px", background:T.surface }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, flexWrap:"wrap", gap:12 }}>
                        <span style={{ fontSize:12, fontWeight:600, color:T.muted, letterSpacing:"0.06em", textTransform:"uppercase" }}>Title variants{titleRes.generated_at ? " · " + new Date(titleRes.generated_at).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : ""}</span>
                        <button onClick={() => regenerateTitles(r.id)} style={{ fontSize:13, fontWeight:600, color:T.goldDark, background:"transparent", border:`1.5px solid ${T.gold}`, borderRadius:8, padding:"7px 15px", cursor:"pointer", fontFamily:"'DM Sans',sans-serif", letterSpacing:"0.02em" }}>Generate new</button>
                      </div>
                      {pickErr[r.id] && <div style={{ fontSize:12, color:T.red, marginBottom:10 }}>Saving title failed. Try again.</div>}
                      {titleRes.current_title && (
                        <div style={{ fontSize:13, color:T.muted, marginBottom:12 }}>Current title: <span style={{ color:T.text, fontWeight:500 }}>{titleRes.current_title}</span></div>
                      )}
                      {titleRes.payoff && (
                        <div style={{ fontSize:13, color:T.muted, marginBottom:14, padding:"10px 14px", background:T.s2, border:`1px solid ${T.borderL}`, borderRadius:10, lineHeight:1.5 }}><span style={{ fontWeight:600, letterSpacing:"0.04em", textTransform:"uppercase", fontSize:11 }}>Payoff</span><br/>{titleRes.payoff}</div>
                      )}
                      <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                        {(titleRes.variants || []).map(v => {
                          const isWinner = v.title && titleRes.final_title && v.title.toLowerCase() === titleRes.final_title.toLowerCase();
                          const ck = copiedKey === r.id + ":v" + v.n;
                          return (
                            <div key={v.n} style={{ display:"flex", alignItems:"center", gap:12, padding:"11px 14px", background:isWinner?T.goldBg:T.surface2, border:`1.5px solid ${isWinner?T.gold:T.border}`, borderRadius:10 }}>
                              <span style={{ flexShrink:0, fontSize:11, fontWeight:700, color:isWinner?T.goldDark:T.muted, letterSpacing:"0.05em" }}>{isWinner ? "★ V"+v.n : "V"+v.n}</span>
                              <div style={{ flex:1, minWidth:0 }}>
                                <div style={{ fontSize:15, fontWeight:isWinner?600:500, color:T.char }}>{v.title}</div>
                                {(v.frames || v.belief) && <div style={{ fontSize:12, color:T.muted, marginTop:2 }}>{v.frames}{v.belief && v.belief !== "none" ? " · breaks: " + v.belief : ""}</div>}
                              </div>
                              {canPick && !(v.title && r.video_title && v.title.toLowerCase() === r.video_title.toLowerCase()) && <button onClick={() => pickTitle(r.id, v.title)} disabled={!!pickBusy[r.id]} style={{ flexShrink:0, fontSize:12, fontWeight:600, color:"#fff", background:pickBusy[r.id]?T.muted:T.goldDark, border:"none", padding:"6px 13px", borderRadius:6, cursor:pickBusy[r.id]?"default":"pointer", fontFamily:"'DM Sans',sans-serif", letterSpacing:"0.03em" }}>{pickBusy[r.id] ? "Saving…" : (pickedKey === r.id + ":" + v.title ? "Saved ✓" : "Use this")}</button>}
                              <button onClick={() => copyTitle(r.id, "v"+v.n, v.title)} style={{ flexShrink:0, fontSize:12, fontWeight:600, color:ck?T.green:T.goldDark, background:ck?T.greenBg:T.goldBg, border:"none", padding:"6px 13px", borderRadius:6, cursor:"pointer", fontFamily:"'DM Sans',sans-serif", letterSpacing:"0.03em" }}>{ck ? "Copied ✓" : "Copy"}</button>
                            </div>
                          );
                        })}
                        {titleRes.final_title && !(titleRes.variants || []).some(v => v.title && v.title.toLowerCase() === titleRes.final_title.toLowerCase()) && (
                          <div style={{ display:"flex", alignItems:"center", gap:12, padding:"11px 14px", background:T.goldBg, border:`1.5px solid ${T.gold}`, borderRadius:10 }}>
                            <span style={{ flexShrink:0, fontSize:11, fontWeight:700, color:T.goldDark, letterSpacing:"0.05em" }}>★ FINAL</span>
                            <div style={{ flex:1, fontSize:15, fontWeight:600, color:T.char }}>{titleRes.final_title}</div>
                            {canPick && !(titleRes.final_title && r.video_title && titleRes.final_title.toLowerCase() === r.video_title.toLowerCase()) && <button onClick={() => pickTitle(r.id, titleRes.final_title)} disabled={!!pickBusy[r.id]} style={{ flexShrink:0, fontSize:12, fontWeight:600, color:"#fff", background:pickBusy[r.id]?T.muted:T.goldDark, border:"none", padding:"6px 13px", borderRadius:6, cursor:pickBusy[r.id]?"default":"pointer", fontFamily:"'DM Sans',sans-serif", letterSpacing:"0.03em" }}>{pickBusy[r.id] ? "Saving…" : (pickedKey === r.id + ":" + titleRes.final_title ? "Saved ✓" : "Use this")}</button>}
                            <button onClick={() => copyTitle(r.id, "final", titleRes.final_title)} style={{ flexShrink:0, fontSize:12, fontWeight:600, color:copiedKey===r.id+":final"?T.green:T.goldDark, background:copiedKey===r.id+":final"?T.greenBg:T.goldBg, border:"none", padding:"6px 13px", borderRadius:6, cursor:"pointer", fontFamily:"'DM Sans',sans-serif", letterSpacing:"0.03em" }}>{copiedKey===r.id+":final" ? "Copied ✓" : "Copy"}</button>
                          </div>
                        )}
                      </div>
                    </td>
                  </tr>
                )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
        {filtered.length === 0 && <div style={{ padding:72, textAlign:"center", color:T.muted, fontSize:14 }}>No runs yet. Generate your first script.</div>}
      </div>

      {totalPages > 1 && (
        <div style={{ display:"flex", justifyContent:"center", alignItems:"center", gap:8, marginTop:40 }}>
          <button onClick={() => setPage(p => Math.max(1, p-1))} disabled={page===1} style={{ padding:"10px 20px", border:`1px solid ${T.border}`, borderRadius:8, fontSize:13, fontWeight:500, color:page===1?T.muted:T.char, background:T.surface2, cursor:page===1?"default":"pointer", opacity:page===1?0.4:1 }}>← Prev</button>
          {Array.from({length:totalPages}, (_,i) => i+1).map(p => (
            <button key={p} onClick={() => setPage(p)} style={{ padding:"10px 16px", border:`1px solid ${p===page?T.gold:T.border}`, borderRadius:8, fontSize:13, fontWeight:p===page?600:400, color:p===page?T.gold:T.muted, background:p===page?T.goldBg:T.surface2, cursor:"pointer" }}>{p}</button>
          ))}
          <button onClick={() => setPage(p => Math.min(totalPages, p+1))} disabled={page===totalPages} style={{ padding:"10px 20px", border:`1px solid ${T.border}`, borderRadius:8, fontSize:13, fontWeight:500, color:page===totalPages?T.muted:T.char, background:T.surface2, cursor:page===totalPages?"default":"pointer", opacity:page===totalPages?0.4:1 }}>Next →</button>
        </div>
      )}
    </div>
  );
}
// ── TOPICS VIEW (creative-facing topic queue editor) ──────────
function TopicsView({ clients, db, toast, onReload, onDirtyChange }) {
  const [slug, setSlug]       = useState("");
  const [clientId, setClientId] = useState(null);
  const [draft, setDraft]     = useState([]);   // working copy
  const [saved, setSaved]     = useState([]);   // last-saved baseline
  const [loading, setLoading] = useState(false);
  const [saving, setSaving]   = useState(false);

  const sel = clients.find(c => c.client_slug === slug);
  const dirty = JSON.stringify(draft) !== JSON.stringify(saved);

  // Report unsaved-state up so the sidebar can warn before navigating away; clear it on unmount.
  useEffect(() => { if (onDirtyChange) onDirtyChange(dirty); }, [dirty]);
  useEffect(() => () => { if (onDirtyChange) onDirtyChange(false); }, []);

  // Warn before closing / refreshing the tab with unsaved edits.
  useEffect(() => {
    function handler(e) { if (dirty) { e.preventDefault(); e.returnValue = ""; } }
    window.addEventListener("beforeunload", handler);
    return () => window.removeEventListener("beforeunload", handler);
  }, [dirty]);

  // Always pull a FRESH copy of the queue from Supabase when a client is picked,
  // so a creative never edits a stale list and overwrites Monday's fresh topics.
  async function loadQueue(s) {
    setLoading(true);
    try {
      const rows = await db.get("client_profiles", `?client_slug=eq.${s}&select=id,client_slug,topic_queue`);
      const row = Array.isArray(rows) ? rows[0] : rows;
      const q = (row && Array.isArray(row.topic_queue)) ? row.topic_queue : [];
      setClientId(row ? row.id : null);
      setDraft(q);
      setSaved(q);
    } catch (e) {
      toast("Couldn't load topics: " + e.message, "error");
      setDraft([]); setSaved([]); setClientId(null);
    }
    setLoading(false);
  }

  function pickClient(newSlug) {
    if (newSlug === slug) return;
    if (dirty && !window.confirm("You have unsaved changes that will be lost. Switch client anyway?")) return;
    setSlug(newSlug);
    if (newSlug) loadQueue(newSlug);
    else { setDraft([]); setSaved([]); setClientId(null); }
  }

  async function save() {
    const id = clientId || (sel && sel.id);
    if (!id) { toast("No client selected.", "error"); return; }
    setSaving(true);
    try {
      const res = await db.patch("client_profiles", id, { topic_queue: draft });
      // With Prefer: return=representation a real update echoes the row(s).
      // An empty result = 0 rows changed: almost always the anon key lacking
      // UPDATE permission (RLS) on client_profiles, or an id that didn't match.
      if (!Array.isArray(res) || res.length === 0) {
        throw new Error("Supabase changed 0 rows — likely the anon key has no UPDATE permission (RLS) on client_profiles.");
      }
      setSaved(draft);
      toast("Topics saved", "success");
      if (onReload) onReload();
    } catch (e) {
      toast("Save failed: " + e.message, "error");
    }
    setSaving(false);
  }

  return (
    <div className="page">
      <div style={{ marginTop:-24, marginLeft:-16, marginBottom:40 }}>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:68, fontWeight:300, color:T.char, lineHeight:0.92, letterSpacing:"-0.02em" }}>Upcoming<br/><span style={{ fontStyle:"italic", color:T.gold }}>topics.</span></div>
      </div>

      <div style={{ maxWidth:720, margin:"0 auto" }}>
        {/* How it works */}
        <div style={{ marginBottom:28, padding:"16px 20px", background:T.goldBg, border:`1px solid ${T.goldLight}`, borderRadius:12, fontSize:13, color:T.goldDark, lineHeight:1.65 }}>
          Every <strong>Monday</strong>, fresh topic ideas land here automatically. Review them and swap in your own anytime. On <strong>Friday</strong> the scripts get written from this list, <strong>top to bottom</strong>.
        </div>

        {/* Select client — same control as the Generate tab */}
        <div style={{ marginBottom: slug ? 24 : 0 }}>
          <div style={{ fontSize:13, fontWeight:600, color:T.text, letterSpacing:"0.06em", textTransform:"uppercase", marginBottom:10 }}>Select client <span style={{ fontWeight:400, textTransform:"none", letterSpacing:0, fontSize:12, color:T.muted }}>– {clients.length} total</span></div>
          {clients.length === 0
            ? <div style={{ padding:"24px 20px", background:T.surface, borderRadius:12, border:`1px solid ${T.border}`, textAlign:"center", fontSize:14, color:T.muted }}>No clients yet. Add one from the Clients tab.</div>
            : <SearchableSelect
                value={slug}
                onChange={pickClient}
                options={clients.map(c => ({ value:c.client_slug, label: c.active ? c.client_name : c.client_name + "  ·  paused" }))}
                placeholder="Choose a client…"
              />
          }
        </div>

        {slug && (
          <div style={{ background:T.surface2, borderRadius:16, border:`1px solid ${T.border}`, overflow:"hidden", boxShadow:"0 4px 32px rgba(0,0,0,0.06), 0 1px 8px rgba(0,0,0,0.04)" }}>
            <div style={{ padding:"26px 28px" }}>
              {loading
                ? <div style={{ padding:"40px 0", textAlign:"center", color:T.muted, fontSize:14 }}>Loading topics…</div>
                : <React.Fragment>
                    <div style={{ fontSize:13, fontWeight:600, color:T.muted, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:6 }}>Topic queue</div>
                    <div style={{ fontSize:13, color:T.muted, marginBottom:18, lineHeight:1.5 }}>The top topic is used first. Use the arrows to reorder, Delete to remove, or add your own at the bottom.</div>

                    <TopicQueue topics={draft} onChange={setDraft} />

                    <div style={{ display:"flex", alignItems:"center", gap:12, marginTop:24, paddingTop:20, borderTop:`1px solid ${T.border}` }}>
                      <button onClick={save} disabled={!dirty || saving} style={{ flex:2, padding:"13px", border:"none", borderRadius:10, background:(dirty && !saving)?T.gold:T.border, color:"#fff", fontSize:14, fontWeight:600, cursor:(dirty && !saving)?"pointer":"default", letterSpacing:"0.02em", fontFamily:"'DM Sans',sans-serif", boxShadow:(dirty && !saving)?"0 2px 12px rgba(196,151,63,0.2)":"none" }}>
                        {saving ? "Saving…" : dirty ? "Save changes" : "Saved ✓"}
                      </button>
                      <button onClick={() => setDraft(saved)} disabled={!dirty || saving} style={{ flex:1, padding:"13px", border:`1px solid ${T.border}`, borderRadius:10, background:"transparent", fontSize:13, fontWeight:500, color: dirty ? T.muted : "rgba(0,0,0,0.22)", cursor: dirty ? "pointer" : "default", fontFamily:"'DM Sans',sans-serif" }}>Discard</button>
                    </div>
                    {dirty && <div style={{ marginTop:10, fontSize:12, color:T.goldDark, textAlign:"center" }}>You have unsaved changes.</div>}
                  </React.Fragment>
              }
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────────
function App({ session, onLogout }) {
  const [view, setView] = useState("generate");
  const [clients, setClients] = useState([]);
  const [runs, setRuns] = useState([]);
  const [toast, setToast] = useState(null);
  const [editClient, setEditClient] = useState(null);
  const [topicsDirty, setTopicsDirty] = useState(false);

  const db = sb(CONFIG.supabaseUrl, CONFIG.supabaseKey);

  // Guard against silently losing unsaved topic edits when leaving the Topics tab via the sidebar.
  function navTo(next) {
    if (next !== view && view === "topics" && topicsDirty &&
        !window.confirm("You have unsaved topic changes that will be lost. Leave this tab anyway?")) return;
    setView(next);
  }

  useEffect(() => {
    setEditClient(null);
    loadClients();
    if (view === "history") loadRuns();
  }, [view]);

  async function loadClients() {
    try { const d = await db.get("client_profiles","?select=*&order=client_name.asc&limit=10000000"); setClients(Array.isArray(d)?d:[]); } catch {}
  }
  async function loadRuns() {
    try { const d = await db.get("script_runs","?select=*&order=created_at.desc&limit=10000000"); setRuns(Array.isArray(d)?d:[]); } catch {}
  }
  function showToast(message, type="success") {
    setToast({message,type});
    setTimeout(() => setToast(null), 3000);
  }

  function handleEditClient(c) {
    setEditClient(c);
    setView("clients");
  }

  return (
    <div style={{ display:"flex", minHeight:"100vh", background:T.bg }}>
      <Sidebar view={view} setView={navTo} clientCount={clients.filter(c=>c.active).length} userEmail={session?.user?.email} onLogout={onLogout} />
      <main style={{ marginLeft:236, flex:1, padding:"72px 80px", minHeight:"100vh", boxSizing:"border-box" }}>
        {view === "generate" && <GenerateView clients={clients} onEditClient={handleEditClient} />}
        {view === "topics"   && <TopicsView clients={clients} db={db} toast={showToast} onReload={loadClients} onDirtyChange={setTopicsDirty} />}
        {view === "clients"  && <ClientsView clients={clients} onReload={loadClients} db={db} toast={showToast} editClient={editClient} setEditClient={setEditClient} />}
        {view === "history"  && <HistoryView runs={runs} onReload={loadRuns} />}
      </main>
      <Toast msg={toast} />
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// AUTH LAYER
// ══════════════════════════════════════════════════════════════

// Shared framed shell so login / forgot / reset all look identical.
function AuthShell({ children, subtitle }) {
  return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", padding:"40px 20px", background:T.bg }}>
      <div className="page" style={{ width:"100%", maxWidth:468 }}>
        <div style={{ background:T.surface2, borderRadius:16, border:`1px solid ${T.border}`, boxShadow:"0 24px 60px rgba(28,25,23,0.10)", overflow:"hidden" }}>
          <div style={{ height:3, background:`linear-gradient(90deg, ${T.gold}, #D4A96A, ${T.gold})` }} />
          <div style={{ padding:"52px 52px 48px" }}>
            <div style={{ textAlign:"center", marginBottom:38 }}>
              <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:13, fontWeight:400, color:T.muted, letterSpacing:"0.18em", textTransform:"uppercase", marginBottom:12 }}>Content Cartel</div>
              <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:40, fontWeight:300, color:T.char, lineHeight:1.15 }}>The Perfect <span style={{ fontStyle:"italic", color:T.gold }}>Script</span></div>
              {subtitle && <div style={{ fontSize:14.5, color:T.muted, marginTop:14, lineHeight:1.55 }}>{subtitle}</div>}
            </div>
            {children}
          </div>
        </div>
      </div>
    </div>
  );
}

function AuthField({ label, type="text", value, onChange, onEnter, placeholder, autoFocus }) {
  return (
    <div style={{ marginBottom:20 }}>
      <label style={{ display:"block", fontSize:13, fontWeight:600, color:T.text, marginBottom:8, letterSpacing:"0.02em" }}>{label}</label>
      <input
        type={type}
        value={value}
        autoFocus={autoFocus}
        placeholder={placeholder}
        onChange={e => onChange(e.target.value)}
        onKeyDown={e => { if (e.key === "Enter" && onEnter) onEnter(); }}
        style={{ padding:"15px 17px", fontSize:15 }}
      />
    </div>
  );
}

function AuthBtn({ children, onClick, disabled, loading }) {
  return (
    <button
      className="gen-btn"
      onClick={disabled || loading ? undefined : onClick}
      disabled={disabled || loading}
      style={{ width:"100%", padding:"16px 28px", borderRadius:11, border:"none", fontSize:16.5, fontWeight:600, letterSpacing:"0.03em", color:"#fff", background:`linear-gradient(135deg, ${T.gold}, ${T.goldDark})`, cursor:(disabled||loading)?"not-allowed":"pointer", opacity:(disabled||loading)?0.55:1 }}
    >
      {loading ? "Please wait…" : children}
    </button>
  );
}

function AuthMsg({ error, ok }) {
  if (!error && !ok) return null;
  const isErr = !!error;
  return (
    <div style={{ marginBottom:20, padding:"12px 15px", borderRadius:10, fontSize:13.5, lineHeight:1.5,
      background:isErr?"#FDF0F0":T.greenBg, color:isErr?T.red:T.green, border:`1px solid ${isErr?"#E8C0C0":"#B8DEC9"}` }}>
      {error || ok}
    </div>
  );
}

// ── LOGIN + FORGOT PASSWORD ───────────────────────────────────
function LoginScreen() {
  const [mode, setMode] = useState("login");   // "login" | "forgot"
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");

  async function login() {
    setErr(""); setOk("");
    if (!email.trim() || !pw) { setErr("Enter your email and password."); return; }
    setBusy(true);
    const { error } = await supaAuth.auth.signInWithPassword({ email: email.trim(), password: pw });
    setBusy(false);
    if (error) setErr(error.message === "Invalid login credentials" ? "Incorrect email or password." : error.message);
    // success → onAuthStateChange in Root swaps to the app automatically
  }

  async function sendReset() {
    setErr(""); setOk("");
    if (!email.trim()) { setErr("Enter your email to receive a reset link."); return; }
    setBusy(true);
    const { error } = await supaAuth.auth.resetPasswordForEmail(email.trim(), { redirectTo: CONFIG.appUrl });
    setBusy(false);
    if (error) { setErr(error.message); return; }
    setOk("If this email has an account, a reset link has been sent. Check your spam folder too.");
  }

  if (mode === "forgot") {
    return (
      <AuthShell subtitle="Enter your email and we'll send you a link to reset your password.">
        <AuthMsg error={err} ok={ok} />
        <AuthField label="Email" type="email" value={email} onChange={setEmail} onEnter={sendReset} placeholder="you@contentcartel.com" autoFocus />
        <div style={{ marginTop:6 }}>
          <AuthBtn onClick={sendReset} loading={busy}>Send reset link</AuthBtn>
        </div>
        <div style={{ textAlign:"center", marginTop:20 }}>
          <button onClick={() => { setMode("login"); setErr(""); setOk(""); }} style={{ background:"none", border:"none", color:T.gold, fontSize:14, fontWeight:500, cursor:"pointer" }}>← Back to login</button>
        </div>
      </AuthShell>
    );
  }

  return (
    <AuthShell>
      <AuthMsg error={err} ok={ok} />
      <AuthField label="Email" type="email" value={email} onChange={setEmail} onEnter={login} placeholder="you@contentcartel.com" autoFocus />
      <AuthField label="Password" type="password" value={pw} onChange={setPw} onEnter={login} placeholder="••••••••" />
      <div style={{ marginTop:6 }}>
        <AuthBtn onClick={login} loading={busy}>Log in</AuthBtn>
      </div>
      <div style={{ textAlign:"center", marginTop:20 }}>
        <button onClick={() => { setMode("forgot"); setErr(""); setOk(""); }} style={{ background:"none", border:"none", color:T.muted, fontSize:13.5, fontWeight:500, cursor:"pointer", textDecoration:"underline", textDecorationColor:T.border, textUnderlineOffset:3 }}>Forgot password?</button>
      </div>
    </AuthShell>
  );
}

// ── SET NEW PASSWORD (recovery link) ──────────────────────────
function ResetPasswordScreen({ onDone }) {
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");

  async function save() {
    setErr(""); setOk("");
    if (pw.length < 8) { setErr("Use at least 8 characters."); return; }
    if (pw !== pw2) { setErr("The passwords don't match."); return; }
    setBusy(true);
    const { error } = await supaAuth.auth.updateUser({ password: pw });
    setBusy(false);
    if (error) { setErr(error.message); return; }
    setOk("Password updated. Logging you in…");
    setTimeout(() => onDone && onDone(), 900);
  }

  return (
    <AuthShell subtitle="Choose a new password for your account.">
      <AuthMsg error={err} ok={ok} />
      <AuthField label="New password" type="password" value={pw} onChange={setPw} onEnter={save} placeholder="at least 8 characters" autoFocus />
      <AuthField label="Confirm password" type="password" value={pw2} onChange={setPw2} onEnter={save} placeholder="repeat password" />
      <div style={{ marginTop:6 }}>
        <AuthBtn onClick={save} loading={busy}>Save password</AuthBtn>
      </div>
    </AuthShell>
  );
}

// ── SESSION SPLASH ────────────────────────────────────────────
function Splash() {
  return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:T.bg }}>
      <div style={{ textAlign:"center" }}>
        <div style={{ width:32, height:32, border:`3px solid ${T.goldLight}`, borderTopColor:T.gold, borderRadius:"50%", margin:"0 auto 18px", animation:"spin 0.8s linear infinite" }} />
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:15, color:T.muted, letterSpacing:"0.04em" }}>Loading session…</div>
      </div>
    </div>
  );
}

// ── ROOT GATE ─────────────────────────────────────────────────
function Root() {
  const [session, setSession] = useState(undefined); // undefined = still loading
  const [recovery, setRecovery] = useState(false);

  useEffect(() => {
    // If the page was opened from a password-reset link, Supabase flags it here.
    if (typeof window !== "undefined" && window.location.hash.includes("type=recovery")) setRecovery(true);

    supaAuth.auth.getSession().then(({ data }) => setSession(data.session ?? null));

    const { data: sub } = supaAuth.auth.onAuthStateChange((event, sess) => {
      setSession(sess ?? null);
      if (event === "PASSWORD_RECOVERY") setRecovery(true);
      if (event === "SIGNED_OUT") setRecovery(false);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  async function logout() {
    await supaAuth.auth.signOut();
    setSession(null);
  }

  if (session === undefined) return <Splash />;
  if (recovery) return <ResetPasswordScreen onDone={() => { setRecovery(false); if (window.history.replaceState) window.history.replaceState(null, "", CONFIG.appUrl); }} />;
  if (!session) return <LoginScreen />;
  return <App session={session} onLogout={logout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
